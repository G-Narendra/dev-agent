[project]
name = "dev"
version = "1.0.0"
description = "Dev - Free 24/7 AI coding agent powered by NVIDIA NIMs."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Dev Team"}]

dependencies = [
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
full = [
    "gitpython>=3.1.0",
    "aiofiles>=24.0.0",
    "tiktoken>=0.7.0",
    "websockets>=13.0",
    "aiohttp>=3.10.0",
]
browser = ["playwright>=1.40.0"]
mcp = ["mcp>=1.0.0"]

[project.scripts]
dev = "dev.cli.entry:main"

[tool.hatch.build.targets.wheel]
packages = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
