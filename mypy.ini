[mypy]
python_version = 3.12
ignore_missing_imports = True
exclude = tests/|__pycache__/|skills/|node_modules/|.venv/|noteflow/|taskflow/|portfolio/
# Minimal settings - only catch actual bugs
disallow_untyped_defs = False
check_untyped_defs = False
warn_return_any = False
warn_unused_configs = False
warn_no_return = True
warn_unused_ignores = False
# Disable all optional checks
disable_error_code = assignment,arg-type,attr-defined,var-annotated,union-attr,truthy-function,return-value,misc,name-defined,dict-item,override,has-type,index,call-arg,no-any-return
