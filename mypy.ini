[mypy]
python_version = 3.12
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True
ignore_missing_imports = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
show_error_codes = True

[mypy-dev.apis.free_apis]
ignore_errors = True

[mypy-dev.utils.feature_parity]
ignore_errors = True

[mypy-dev.tools.tool_defs]
ignore_errors = True

[mypy-dev.agents.skill_integration]
ignore_errors = True

[mypy-dev.agents.tool_executor]
# Mixin module: types are set at runtime by parent class
ignore_errors = True

[mypy-tests.*]
ignore_errors = True
