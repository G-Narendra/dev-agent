# ──────────────────────────────────────────────────────────────
# STARTUP ARCHETYPES — Industry-specific role extensions
# ──────────────────────────────────────────────────────────────
archetypes:

  saas:
    display_name: "SaaS / Micro-SaaS"
    description: "Subscription software delivered via cloud"
    examples: ["Notion", "Slack", "Linear", "Calendly"]
    keywords: ["subscription", "saas", "cloud software", "b2b tool", "productivity"]
    additional_roles: []   # Pure SaaS uses only universal roles
    cloud_override: cloud-engineer-vercel
    recommended_stack: "Next.js + TypeScript + PostgreSQL + Stripe"

  ai:
    display_name: "AI / Agentic Startup"
    description: "LLM, ML, or agent-powered products"
    examples: ["OpenAI", "Jasper", "Cursor", "Perplexity"]
    keywords: ["ai", "llm", "machine learning", "agent", "rag", "gpt", "chatbot", "generative"]
    additional_roles:
      - ai-engineer
      - llm-engineer
      - prompt-engineer
      - ai-ml-engineer
      - mlops-engineer
      - data-engineer
      - ai-safety-engineer
      - data-labeling-ops
      - rag-engineer
      - llm-evaluator
      - machine-learning-researcher
      - ml-ops-engineer
      - dataset-engineer
      - ai-architect
      - ai-product-manager
      - ai-ethics-officer
      - ai-integration-engineer
      - machine-learning-engineer
      - ai-agents-engineer
      - vector-database-engineer
      - nlp-engineer
      - computer-vision-engineer
    cloud_override: cloud-engineer-aws    # GPU instances — AWS-focused cloud engineer
    recommended_stack: "Next.js + Python/FastAPI + PostgreSQL + Pinecone"

  ecommerce:
    display_name: "E-Commerce / D2C"
    description: "Selling physical or digital goods directly to consumers"
    examples: ["Shopify stores", "Warby Parker", "Glossier"]
    keywords: ["ecommerce", "shop", "store", "d2c", "product", "sell", "buy", "cart", "checkout"]
    additional_roles:
      - ecommerce-engineer
      - inventory-manager
      - fulfillment-engineer
      - ecommerce-manager
      - customer-experience-designer
      - marketplace-ops
      - shopify-developer
      - merchandiser
      - dtc-brand-manager
      - dtc-e-commerce-manager
      - dtc-retention-manager
      - dtc-supply-chain-manager
      - email-deliverability-specialist
      - email-marketing-specialist
    cloud_override: cloud-engineer-vercel
    recommended_stack: "Next.js + Shopify API + PostgreSQL + Stripe"

  marketplace:
    display_name: "Marketplace"
    description: "Platform connecting buyers and sellers"
    examples: ["Airbnb", "Uber", "Fiverr", "Etsy"]
    keywords: ["marketplace", "buyers", "sellers", "platform", "matching", "two-sided"]
    additional_roles:
      - trust-safety-engineer
      - matching-algorithm-engineer
      - customer-success-manager
      - customer-experience-designer
      - dispute-resolution-specialist
      - marketplace-engineer
    cloud_override: cloud-engineer-aws
    recommended_stack: "Next.js + Node.js + PostgreSQL + Algolia"

  fintech:
    display_name: "FinTech"
    description: "Financial services via technology"
    examples: ["Stripe", "Razorpay", "Plaid", "Robinhood"]
    keywords: ["fintech", "payments", "banking", "lending", "insurance", "wallet", "crypto", "neobank"]
    additional_roles:
      - payments-engineer
      - payments-compliance
      - fraud-analyst
      - compliance-engineer-fintech
      - ledger-engineer
      - risk-manager
      - blockchain-developer
      - fintech-engineer
      - banking-liaison
      - treasurer
    cloud_override: cloud-engineer-aws
    recommended_stack: "Node.js + PostgreSQL + Redis + Stripe Connect"

  healthtech:
    display_name: "HealthTech / MedTech"
    description: "Healthcare delivery and medical technology"
    examples: ["Teladoc", "1mg", "Practo"]
    keywords: ["health", "medical", "telemedicine", "patient", "doctor", "clinic", "pharma", "hipaa"]
    additional_roles:
      - healthcare-compliance-officer
      - telemedicine-developer
      - clinical-operations
      - biomedical-engineer
      - healthtech-engineer
    cloud_override: cloud-engineer-aws
    recommended_stack: "React + Node.js + PostgreSQL + AWS (HIPAA-eligible)"

  edtech:
    display_name: "EdTech"
    description: "Learning platforms and educational tools"
    examples: ["Coursera", "Duolingo", "BYJU'S", "Khan Academy"]
    keywords: ["education", "learning", "course", "student", "teacher", "tutoring", "lms", "quiz"]
    additional_roles:
      - instructional-designer
      - edtech-engineer
      - curriculum-designer
      - assessment-engineer
    cloud_override: cloud-engineer-vercel
    recommended_stack: "Next.js + Node.js + PostgreSQL + Mux (video)"

  web3:
    display_name: "Web3 / Crypto / DeFi"
    description: "Decentralized applications and blockchain protocols"
    examples: ["Uniswap", "Aave", "OpenSea", "MetaMask"]
    keywords: ["web3", "crypto", "blockchain", "defi", "nft", "token", "smart contract", "dao", "wallet"]
    additional_roles:
      - smart-contract-engineer
      - protocol-engineer
      - tokenomics-expert
      - defi-strategist
      - web3-frontend-engineer
      - blockchain-architect
      - web3-engineer
    cloud_override: cloud-engineer-aws
    recommended_stack: "Next.js + Solidity + Foundry + Alchemy"

  gaming:
    display_name: "Gaming"
    description: "Video games and interactive entertainment"
    examples: ["Supercell", "InnerSloth", "indie studios"]
    keywords: ["game", "gaming", "play", "multiplayer", "mobile game", "steam", "unity", "unreal"]
    additional_roles:
      - game-designer
      - game-developer
      - level-designer
      - narrative-designer
      - technical-artist
      - monetization-designer
      - qa-engineer
      - animator
      - animator-3d
      - motion-designer
      - motion-graphics-designer
      - quality-assurance-manager
    cloud_override: cloud-engineer-aws
    recommended_stack: "Unity/Unreal + C#/C++ + PlayFab"

  iot-hardware:
    display_name: "IoT / Hardware"
    description: "Physical devices with embedded software"
    examples: ["Ring", "Fitbit", "Raspberry Pi products"]
    keywords: ["iot", "hardware", "device", "sensor", "wearable", "embedded", "firmware", "smart home"]
    additional_roles:
      - firmware-engineer
      - hardware-engineer
      - industrial-designer
      - manufacturing-engineer
      - embedded-systems-engineer
      - electrical-engineer
      - mechanical-engineer
    cloud_override: cloud-engineer-aws
    recommended_stack: "C/C++ + FreeRTOS + AWS IoT Core + React (dashboard)"

  devtools:
    display_name: "Developer Tools / DevTech"
    description: "Tools built for developers"
    examples: ["Vercel", "Supabase", "Railway", "Linear"]
    keywords: ["developer tool", "cli", "sdk", "api platform", "devtools", "dx", "open source"]
    additional_roles:
      - cli-ux-designer
      - sdk-engineer
      - developer-advocate
      - developer-relations-manager
      - devtools-engineer
    cloud_override: cloud-engineer-vercel
    recommended_stack: "TypeScript + Go + PostgreSQL + Vercel"

  media-creator:
    display_name: "Media / Content / Creator Economy"
    description: "Content creation and distribution platforms"
    examples: ["Substack", "Patreon", "Spotify", "YouTube"]
    keywords: ["content", "creator", "media", "video", "podcast", "newsletter", "streaming"]
    additional_roles:
      - content-platform-engineer
      - recommendation-engineer
      - creator-economy-engineer
      - video-audio-engineer
      - animator
      - video-producer
      - videographer
      - motion-designer
      - motion-graphics-designer
    cloud_override: cloud-engineer-aws
    recommended_stack: "Next.js + Node.js + PostgreSQL + Mux + S3"

  agritech:
    display_name: "AgriTech"
    description: "Technology for agriculture and farming"
    examples: ["CropIn", "DeHaat", "Ninjacart"]
    keywords: ["agriculture", "farming", "crop", "soil", "harvest", "agri", "farm-to-table"]
    additional_roles:
      - data-scientist
      - supply-chain-manager
      - field-operations-tech
    cloud_override: cloud-engineer-aws
    recommended_stack: "React Native + Python + PostgreSQL + GCP Maps"

  proptech:
    display_name: "PropTech / Real Estate"
    description: "Technology for property and real estate"
    examples: ["Zillow", "NoBroker", "Opendoor"]
    keywords: ["real estate", "property", "rent", "lease", "housing", "broker", "listing"]
    additional_roles:
      - proptech-engineer
      - valuation-model-engineer
      - tenant-management-engineer
    cloud_override: cloud-engineer-vercel
    recommended_stack: "Next.js + Node.js + PostgreSQL + Mapbox"

  cleantech:
    display_name: "CleanTech / Climate"
    description: "Sustainability, clean energy, and climate solutions"
    examples: ["Tesla Energy", "Arcadia", "Pachama"]
    keywords: ["climate", "sustainability", "clean energy", "solar", "carbon", "green", "esg"]
    additional_roles:
      - energy-systems-engineer
      - esg-analyst
      - sustainability-officer
    cloud_override: cloud-engineer-aws
    recommended_stack: "Python + React + PostgreSQL + AWS"
