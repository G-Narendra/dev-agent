# ============================================================
# startup-types.yaml — Master Startup Archetype Registry
# ============================================================
# This manifest maps every startup archetype to:
#   1. The universal roles ALL startups need
#   2. The industry-specific roles unique to that archetype
#   3. The recommended build phases and priority order
#
# Usage: The CLI agent reads this file FIRST, matches the user's
# idea to an archetype (or hybrid), then loads only the
# relevant role README.md + skill YAMLs.
# ============================================================

