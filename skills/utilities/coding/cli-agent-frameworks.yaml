# ── IDENTITY ─────────────────────────────────────────────────
name: "cli-agent-frameworks"
display_name: "CLI Agent Framework Integrator"
description: >
  Installs, configures, and orchestrates terminal-native AI agent 
  frameworks (Goose, Gemini CLI, OpenCode, pilotty, term_agent) as 
  sub-processes within a larger autonomous pipeline. Enables the AI to 
  spawn specialized CLI agents for code generation, terminal automation, 
  system management, and background task execution — all without 
  leaving the command line.

# ── CLASSIFICATION ───────────────────────────────────────────
role: "utility"
phase: "all"
applicable_startups:
  - all
priority: "high"
difficulty: "advanced"

# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "Spawn a CLI agent for this task."
  - "Use Goose to build this."
  - "Run a terminal agent on this project."
  - "Automate this workflow with a CLI agent."
  - "Orchestrate multiple agent frameworks."

# ── ACTIONS ──────────────────────────────────────────────────
example_cli_actions:
  - "Spawn Goose agent for code generation."
  - "Launch Gemini CLI on project."
  - "Run headless pilotty session."
  - "Install and configure OpenCode with MCP."

# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "task_description"
      type: "string"
      description: "What the CLI agent should accomplish."
    - name: "preferred_framework"
      type: "string"
      description: "Which agent framework to use (goose, gemini-cli, opencode, pilotty, term_agent)."
  optional:
    - name: "project_path"
      type: "string"
      description: "Path to the project directory."
      default: "Current directory"
    - name: "agent_config"
      type: "string"
      description: "Custom configuration overrides."
      default: "Framework defaults"

outputs:
  files:
    - path: "outputs/cli-agent-session-{timestamp}.log"
      description: "Full session log from the CLI agent."
    - path: "outputs/cli-agent-artifacts/"
      description: "Any files generated by the agent."
  artifacts:
    - "A summary of what the CLI agent accomplished."
    - "Exit code and any error messages."

# ── SUCCESS CRITERIA ─────────────────────────────────────────
success_criteria:
  automated:
    - "The CLI agent exits with code 0 (success)."
    - "Expected output files exist at the target paths."
  manual:
    - "The agent's output is verified by human review."
    - "No unintended side effects on the filesystem."

# ── PERMISSIONS & SAFETY ─────────────────────────────────────
permissions_needed:
  - "filesystem"
  - "network"
  - "shell_execution"

safety_notes:
  - "NEVER install agent frameworks globally. Always create a venv or use `npx`/`cargo install --root ./tools` to keep dependencies inside the project."
  - "CLI agents can execute arbitrary shell commands. This is a HIGH-RISK permission — always isolate the agent to the project directory."
  - "pilotty spawns real PTY sessions — monitor for runaway processes with a timeout (default: 300s)."
  - "OpenCode and Goose can write files — validate that output stays within the project boundary."
  - "Never run these agents in production environments without a sandbox."

# ── TOOLING ──────────────────────────────────────────────────
recommended_tools:
  primary:
    - name: "Goose"
      install: "pip install goose-ai (in venv)"
      url: "https://github.com/block/goose"
  alternatives:
    - name: "Gemini CLI"
      install: "npm install -g @google/gemini-cli (use npx instead)"
      url: "https://github.com/google-gemini/gemini-cli"
    - name: "OpenCode"
      install: "pip install opencode (in venv) or npx opencode"
      url: "https://github.com/opencode-dev/opencode"
    - name: "pilotty"
      install: "pip install pilotty (in venv)"
      url: "https://github.com/msmps/pilotty"
    - name: "term_agent"
      install: "pip install term-agent (in venv)"
      url: "https://github.com/noxgle/term_agent"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "Select the Right Framework"
    tasks:
      - "For code generation and full-stack tasks → Goose or OpenCode (best MCP support)."
      - "For terminal automation and headless scripts → pilotty (manages real PTY sessions)."
      - "For multimodal/system tasks → Gemini CLI (Google's model integration)."
      - "For Linux sysadmin automation → term_agent."
  - step: "Install in Virtual Environment"
    tasks:
      - "Create a project venv: `python -m venv .venv && source .venv/bin/activate`."
      - "Install the chosen agent: `pip install goose-ai` or `pip install opencode`."
      - "Never use `pip install --global` or `npm install -g`."
  - step: "Configure MCP Servers (if supported)"
    tasks:
      - "Check if the agent supports MCP (Goose and OpenCode do)."
      - "Create or edit the agent's MCP config file with required servers."
      - "Test with a simple command: `goose run \"list files in current directory\"`."
  - step: "Define Task Boundaries"
    tasks:
      - "Goose: `goose run --working-dir ./project-folder \"...\"`"
      - "Gemini CLI: `gemini --project ./project-folder run \"...\"`"
      - "OpenCode: `opencode --cwd ./project-folder \"...\"`"
      - "pilotty: `pilotty --workdir ./project-folder exec \"...\"`"
      - "Set a timeout: `timeout 300 goose run \"...\"` to prevent runaway agents."
      - "Redirect output to a log file: `goose run \"...\" > agent-session.log 2>&1`."
  - step: "Post-Session Cleanup"
    tasks:
      - "Check the exit code. Non-zero means something went wrong."
      - "Review any files the agent created or modified."
      - "Kill any lingering processes: `pkill -f goose` if needed."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Installing multiple agent frameworks globally — they conflict on dependencies."
  - "Running agents without directory scoping — they may traverse the entire filesystem."
  - "Assuming agent output is perfect — always review generated code before committing."
  - "Using agents in CI/CD pipelines without sandboxing."

best_practices:
  - "Treat CLI agents as specialized workers: Goose for coding, pilotty for terminal automation, etc."
  - "Use `--dry-run` or `--yes=false` flags when available to review actions before execution."
  - "Keep a `.agentignore` file in your project to prevent agents from touching sensitive paths."
  - "Version-control any MCP configuration files alongside your project."

# ── REFERENCES ───────────────────────────────────────────────
references:
  - title: "Goose — Block's Terminal-First AI Agent"
    url: "https://github.com/block/goose"
  - title: "Gemini CLI — Google's Terminal Agent"
    url: "https://github.com/google-gemini/gemini-cli"
  - title: "OpenCode — Open-Source Coding Harness"
    url: "https://github.com/opencode-dev/opencode"
  - title: "pilotty — Headless Terminal Automation"
    url: "https://github.com/msmps/pilotty"
  - title: "awesome-cli-coding-agents (Curated List)"
    url: "https://github.com/bradagi/awesome-cli-coding-agents"
