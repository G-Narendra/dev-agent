# ── IDENTITY ─────────────────────────────────────────────────
name: "production-rag"
display_name: "Production Retrieval-Augmented Generation"
description: >
  Implement a production-grade RAG pipeline integrating document parsing, semantic chunking,
  hybrid search (Vector + BM25), and cross-encoder re-ranking before generation.

# ── CLASSIFICATION ───────────────────────────────────────────
role: "rag-engineer"
phase: "build"
applicable_startups: 
  - ai
priority: "mvp"
difficulty: "advanced"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "Ingestion & Chunking"
    tasks:
      - "Parse PDFs/Docs and use semantic chunking (e.g., split by headers/paragraphs, not arbitrary character counts)."
      - "Generate embeddings using a high-quality model (e.g., text-embedding-3-large or BGE)."
  - step: "Retrieval"
    tasks:
      - "Implement a Vector DB (Pinecone, Qdrant, pgvector)."
      - "Implement Hybrid Search: Query both the vector index and a BM25 keyword index."
  - step: "Re-Ranking & Generation"
    tasks:
      - "Pass the top 20 results through a Cohere or open-source Cross-Encoder to re-rank."
      - "Inject the top 3-5 results into the LLM system prompt for generation."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Blindly trusting LangChain's default `RecursiveCharacterTextSplitter(chunk_size=1000)` — this often cuts sentences in half and destroys context."

best_practices:
  - "Document decisions and rationale for future reference."
  - "Test assumptions early and iterate based on feedback."
  - "Keep security and compliance in mind from the start -- retrofitting is expensive."
# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "Run the Production Rag process"
  - "How do I handle production rag?"
  - "Implement production rag"
# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "context"
      type: "string"
      description: "Context for the production rag process"
  optional:
    - name: "code_repository"
      type: "string"
      description: "Path to the code repository"
      default: "./"

outputs:
  files:
    - path: "outputs/production-rag.md"
      description: "Results of the production rag process"
  artifacts:
    - "Completed production rag deliverable"
# ── UNIVERSAL INDUSTRIAL APPLICABILITY ──────────────────────
applicable_industries:
  - SaaS & Cloud Infrastructure
  - FinTech & DeFi
  - HealthTech & BioTech
  - DefenseTech & Aerospace
  - E-Commerce & Logistics
  - AI & Machine Learning
industrial_readiness:
  - "The role MUST dynamically adapt its FAANG-scale physics to the user's specific industry."
  - "If the user is building FinTech, enforce PCI-DSS, ACID transactions, and idempotency."
  - "If the user is building HealthTech, enforce HIPAA and zero-trust data privacy."
  - "If the user is building DefenseTech, enforce air-gapped security and extreme redundancy."
  - "Always output production-ready, highly scalable, and mathematically verified architectures regardless of the startup's domain."

# ── REFERENCES ───────────────────────────────────────────────
references:
  - title: "Industry Best Practices"
    path: "."
  - title: "Relevant Documentation"
    path: "."