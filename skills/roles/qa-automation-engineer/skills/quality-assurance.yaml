# ── IDENTITY ─────────────────────────────────────────────────
name: "quality-assurance"
display_name: "Manual & Exploratory QA"
description: >
  Execute structured and unstructured (exploratory) testing to break the application 
  in ways automated tests cannot, focusing on edge cases and UX anomalies.

# ── CLASSIFICATION ───────────────────────────────────────────
role: "qa-automation-engineer"
phase: "build"
applicable_startups: 
  - all
priority: "high"
difficulty: "advanced"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "Test Case Design"
    tasks:
      - "Write boundary value tests specifically for input fields (e.g., trying to submit a negative number for a pricing field)."
  - step: "Exploratory Testing"
    tasks:
      - "Use the application exactly like a frustrated, non-technical user would (double-clicking submit buttons quickly, using the back button mid-checkout)."
  - step: "Bug Reporting"
    tasks:
      - "File bug reports that include exact steps to reproduce, device info, console errors, and a video recording of the crash."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Filing a bug ticket that just says 'The checkout is broken', requiring the engineer to spend 4 hours trying to guess what device or state caused it."

best_practices:
  - "Document decisions and rationale for future reference."
  - "Test assumptions early and iterate based on feedback."
  - "Keep security and compliance in mind from the start -- retrofitting is expensive."
# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "Run the Quality Assurance process"
  - "How do I handle quality assurance?"
  - "Implement quality assurance"
# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "context"
      type: "string"
      description: "Context for the quality assurance process"
  optional:
    - name: "N/A"
      type: "string"
      description: "No optional inputs needed."

outputs:
  files:
    - path: "outputs/quality-assurance.md"
      description: "Results of the quality assurance process"
  artifacts:
    - "Completed quality assurance deliverable"
# ── UNIVERSAL INDUSTRIAL APPLICABILITY ──────────────────────
applicable_industries:
  - SaaS & Cloud Infrastructure
  - FinTech & DeFi
  - HealthTech & BioTech
  - DefenseTech & Aerospace
  - E-Commerce & Logistics
  - AI & Machine Learning
industrial_readiness:
  - "The role MUST dynamically adapt its FAANG-scale physics to the user's specific industry."
  - "If the user is building FinTech, enforce PCI-DSS, ACID transactions, and idempotency."
  - "If the user is building HealthTech, enforce HIPAA and zero-trust data privacy."
  - "If the user is building DefenseTech, enforce air-gapped security and extreme redundancy."
  - "Always output production-ready, highly scalable, and mathematically verified architectures regardless of the startup's domain."

# ── REFERENCES ───────────────────────────────────────────────
references:
  - title: "Industry Best Practices"
    path: "."
  - title: "Relevant Documentation"
    path: "."