# ── IDENTITY ─────────────────────────────────────────────────
name: "video-streaming-architecture"
display_name: "Video Streaming Architecture (HLS/WebRTC)"
description: >
  Architect and implement scalable video delivery for Live and Video-on-Demand (VOD)
  using HTTP Live Streaming (HLS) and edge CDN caching.

# ── CLASSIFICATION ───────────────────────────────────────────
role: "creator-economy-engineer"
phase: "build"
applicable_startups: 
  - media
  - creator-economy
priority: "mvp"
difficulty: "expert"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "Ingest & Transcoding"
    tasks:
      - "Set up an RTMP ingest endpoint using AWS MediaLive or Mux."
      - "Configure transcoding profiles (1080p, 720p, 480p) to support adaptive bitrate streaming."
  - step: "Delivery"
    tasks:
      - "Generate HLS manifests (`.m3u8`) and segment files (`.ts`)."
      - "Configure a global CDN (Cloudflare/CloudFront) to cache video segments at the edge."
  - step: "Playback"
    tasks:
      - "Implement a performant web player (e.g., Video.js or HLS.js) that handles adaptive bitrate switching smoothly."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Serving raw `.mp4` files directly from an S3 bucket or basic web server — this destroys bandwidth and buffers constantly."

best_practices:
  - "Document decisions and rationale for future reference."
  - "Test assumptions early and iterate based on feedback."
  - "Keep security and compliance in mind from the start -- retrofitting is expensive."
# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "Run the Video Streaming Architecture process"
  - "How do I handle video streaming architecture?"
  - "Implement video streaming architecture"
# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "context"
      type: "string"
      description: "Context for the video streaming architecture process"
  optional:
    - name: "code_repository"
      type: "string"
      description: "Path to the code repository"
      default: "./"

outputs:
  files:
    - path: "outputs/video-streaming-architecture.md"
      description: "Results of the video streaming architecture process"
  artifacts:
    - "Completed video streaming architecture deliverable"
# ── UNIVERSAL INDUSTRIAL APPLICABILITY ──────────────────────
applicable_industries:
  - SaaS & Cloud Infrastructure
  - FinTech & DeFi
  - HealthTech & BioTech
  - DefenseTech & Aerospace
  - E-Commerce & Logistics
  - AI & Machine Learning
industrial_readiness:
  - "The role MUST dynamically adapt its FAANG-scale physics to the user's specific industry."
  - "If the user is building FinTech, enforce PCI-DSS, ACID transactions, and idempotency."
  - "If the user is building HealthTech, enforce HIPAA and zero-trust data privacy."
  - "If the user is building DefenseTech, enforce air-gapped security and extreme redundancy."
  - "Always output production-ready, highly scalable, and mathematically verified architectures regardless of the startup's domain."

# ── REFERENCES ───────────────────────────────────────────────
references:
  - title: "Industry Best Practices"
    path: "."
  - title: "Relevant Documentation"
    path: "."