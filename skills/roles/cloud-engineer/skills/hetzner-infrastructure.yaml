# ── IDENTITY ─────────────────────────────────────────────────
name: "hetzner-infrastructure"
display_name: "Hetzner Bare Metal Infrastructure"
description: >
  Deploy and manage cost-effective, high-performance bare metal servers and cloud VMs 
  on Hetzner for bootstrapped startups that want to avoid AWS egress fees.

# ── CLASSIFICATION ───────────────────────────────────────────
role: "cloud-engineer"
phase: "growth"
applicable_startups: 
  - bootstrapped
  - deeptech
priority: "high"
difficulty: "expert"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "Server Provisioning"
    tasks:
      - "Use Terraform with the Hetzner Cloud provider (`hcloud`) to automatically provision servers, networks, and firewalls."
  - step: "vSwitch Networking"
    tasks:
      - "Attach all servers to a private vSwitch so internal traffic between the API and Database is free and not exposed to the internet."
  - step: "High Availability (HA)"
    tasks:
      - "Configure Floating IPs in front of HAProxy or Nginx to ensure traffic can be instantly routed to a backup server if the primary bare metal node fails."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Running an entire SaaS platform on a single €40/month Hetzner dedicated server with absolutely no backup node, risking total failure during a hardware fault."

best_practices:
  - "Document decisions and rationale for future reference."
  - "Test assumptions early and iterate based on feedback."
  - "Keep security and compliance in mind from the start -- retrofitting is expensive."
# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "Run the Hetzner Infrastructure process"
  - "How do I handle hetzner infrastructure?"
  - "Implement hetzner infrastructure"
# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "context"
      type: "string"
      description: "Context for the hetzner infrastructure process"
  optional:
    - name: "N/A"
      type: "string"
      description: "No optional inputs needed."

outputs:
  files:
    - path: "outputs/hetzner-infrastructure.md"
      description: "Results of the hetzner infrastructure process"
  artifacts:
    - "Completed hetzner infrastructure deliverable"
# ── UNIVERSAL INDUSTRIAL APPLICABILITY ──────────────────────
applicable_industries:
  - SaaS & Cloud Infrastructure
  - FinTech & DeFi
  - HealthTech & BioTech
  - DefenseTech & Aerospace
  - E-Commerce & Logistics
  - AI & Machine Learning
industrial_readiness:
  - "The role MUST dynamically adapt its FAANG-scale physics to the user's specific industry."
  - "If the user is building FinTech, enforce PCI-DSS, ACID transactions, and idempotency."
  - "If the user is building HealthTech, enforce HIPAA and zero-trust data privacy."
  - "If the user is building DefenseTech, enforce air-gapped security and extreme redundancy."
  - "Always output production-ready, highly scalable, and mathematically verified architectures regardless of the startup's domain."

# ── REFERENCES ───────────────────────────────────────────────
references:
  - title: "AWS Documentation"
    url: "https://docs.aws.amazon.com"
  - title: "Terraform Documentation"
    url: "https://developer.hashicorp.com/terraform/docs"