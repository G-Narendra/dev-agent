# ── IDENTITY ─────────────────────────────────────────────────
name: "object-storage"
display_name: "Cloud Object Storage Management"
description: >
  Architect secure, high-throughput file upload systems utilizing S3, signed URLs, 
  and CDNs to prevent server bandwidth bottlenecks.

# ── CLASSIFICATION ───────────────────────────────────────────
role: "cloud-engineer"
phase: "build"
applicable_startups: 
  - all
priority: "high"
difficulty: "advanced"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "Direct-to-S3 Uploads"
    tasks:
      - "Never upload files from the client to your backend server. Have the backend generate a pre-signed S3 URL, and have the client upload the 500MB video directly to the S3 bucket."
  - step: "CDN Caching"
    tasks:
      - "Put a CloudFront CDN in front of the S3 bucket for all public assets (images/CSS). Never serve public assets directly from the S3 origin due to high egress costs."
  - step: "Lifecycle Policies"
    tasks:
      - "Implement S3 Lifecycle rules to automatically transition logs and old backups to S3 Glacier after 30 days, cutting storage costs by 80%."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Making the entire S3 bucket 'Publicly Readable' just to host a few profile pictures, accidentally exposing thousands of confidential PDF invoices to the public internet."

best_practices:
  - "Document decisions and rationale for future reference."
  - "Test assumptions early and iterate based on feedback."
  - "Keep security and compliance in mind from the start -- retrofitting is expensive."
# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "Run the Object Storage process"
  - "How do I handle object storage?"
  - "Implement object storage"
# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "context"
      type: "string"
      description: "Context for the object storage process"
  optional:
    - name: "N/A"
      type: "string"
      description: "No optional inputs needed."

outputs:
  files:
    - path: "outputs/object-storage.md"
      description: "Results of the object storage process"
  artifacts:
    - "Completed object storage deliverable"
# ── UNIVERSAL INDUSTRIAL APPLICABILITY ──────────────────────
applicable_industries:
  - SaaS & Cloud Infrastructure
  - FinTech & DeFi
  - HealthTech & BioTech
  - DefenseTech & Aerospace
  - E-Commerce & Logistics
  - AI & Machine Learning
industrial_readiness:
  - "The role MUST dynamically adapt its FAANG-scale physics to the user's specific industry."
  - "If the user is building FinTech, enforce PCI-DSS, ACID transactions, and idempotency."
  - "If the user is building HealthTech, enforce HIPAA and zero-trust data privacy."
  - "If the user is building DefenseTech, enforce air-gapped security and extreme redundancy."
  - "Always output production-ready, highly scalable, and mathematically verified architectures regardless of the startup's domain."

# ── REFERENCES ───────────────────────────────────────────────
references:
  - title: "AWS Documentation"
    url: "https://docs.aws.amazon.com"
  - title: "Terraform Documentation"
