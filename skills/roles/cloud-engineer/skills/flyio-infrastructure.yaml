# ── IDENTITY ─────────────────────────────────────────────────
name: "flyio-infrastructure"
display_name: "Fly.io Global Application Deployment"
description: >
  Deploy Dockerized full-stack applications globally on Fly.io, leveraging distributed 
  SQLite (LiteFS) or Postgres to serve data close to users with minimal latency.

# ── CLASSIFICATION ───────────────────────────────────────────
role: "cloud-engineer"
phase: "build"
applicable_startups: 
  - devtools
  - saas
priority: "high"
difficulty: "advanced"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "Multi-Region Deployment"
    tasks:
      - "Deploy app instances to multiple regions (e.g., IAD, FRA, NRT) and let Fly's Anycast network route the user to the closest physical server."
  - step: "Distributed Data"
    tasks:
      - "If using SQLite, configure LiteFS to replicate the database to all edge nodes for instant read speeds, routing writes back to the primary node."
  - step: "Persistent Volumes"
    tasks:
      - "Ensure databases and stateful services are attached to Fly Volumes, as Fly machines are ephemeral and will wipe local disk changes on restart."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Deploying the web server globally in 10 regions, but leaving the primary Postgres database in Virginia, resulting in users in Tokyo experiencing 500ms latency on every click."

best_practices:
  - "Document decisions and rationale for future reference."
  - "Test assumptions early and iterate based on feedback."
  - "Keep security and compliance in mind from the start -- retrofitting is expensive."
# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "Run the Flyio Infrastructure process"
  - "How do I handle flyio infrastructure?"
  - "Implement flyio infrastructure"
  - "Deploy Dockerized full-stack applications globally on Fly"
# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "context"
      type: "string"
      description: "Context for the flyio infrastructure process"
  optional:
    - name: "data_source"
      type: "string"
      description: "Source of data to analyze"
      default: "Internal data"
    - name: "target_audience"
      type: "string"
      description: "Target user or customer segment"
      default: "Primary user persona"

outputs:
  files:
    - path: "outputs/flyio-infrastructure.md"
      description: "Results of the flyio infrastructure process"
  artifacts:
    - "Completed flyio infrastructure deliverable"
# ── UNIVERSAL INDUSTRIAL APPLICABILITY ──────────────────────
applicable_industries:
  - SaaS & Cloud Infrastructure
  - FinTech & DeFi
  - HealthTech & BioTech
  - DefenseTech & Aerospace
  - E-Commerce & Logistics
  - AI & Machine Learning
industrial_readiness:
  - "The role MUST dynamically adapt its FAANG-scale physics to the user's specific industry."
  - "If the user is building FinTech, enforce PCI-DSS, ACID transactions, and idempotency."
  - "If the user is building HealthTech, enforce HIPAA and zero-trust data privacy."
  - "If the user is building DefenseTech, enforce air-gapped security and extreme redundancy."
  - "Always output production-ready, highly scalable, and mathematically verified architectures regardless of the startup's domain."

# ── REFERENCES ───────────────────────────────────────────────
references:
  - title: "AWS Documentation"
    url: "https://docs.aws.amazon.com"
  - title: "Terraform Documentation"
    url: "https://developer.hashicorp.com/terraform/docs"