      type: "string"
      description: "Context for the bias mitigation audit process"
  optional:
    - name: "data_source"
      type: "string"
      description: "Source of data to analyze"
      default: "Internal data"

outputs:
  files:
    - path: "outputs/bias-mitigation-audit.md"
      description: "Results of the bias mitigation audit process"
  artifacts:
