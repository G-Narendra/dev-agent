# ── IDENTITY ─────────────────────────────────────────────────
name: "documentation-generation"
display_name: "Automated Documentation Generation"
description: >
  Configure tooling to automatically generate and host beautiful, accurate documentation 
  from code comments and OpenAPI specifications.

# ── CLASSIFICATION ───────────────────────────────────────────
role: "product-evangelist"
phase: "growth"
applicable_startups: 
  - api-first
  - devtools
priority: "high"
difficulty: "advanced"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "OpenAPI Spec"
    tasks:
      - "Ensure the backend generates a valid `openapi.json` file on every build, containing all endpoint paths, request bodies, and authentication methods."
  - step: "Doc Hosting"
    tasks:
      - "Use tools like Mintlify, ReadMe, or Docusaurus to consume the OpenAPI spec and generate interactive, beautiful API docs."
  - step: "Code Snippets"
    tasks:
      - "Ensure the generated docs automatically provide copy-paste code snippets in cURL, Python, Node, and Go."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Writing API documentation manually in a massive Google Doc that becomes outdated the exact second an engineer pushes a new code deployment."

best_practices:
  - "Document decisions and rationale for future reference."
  - "Test assumptions early and iterate based on feedback."
  - "Keep security and compliance in mind from the start -- retrofitting is expensive."
# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "Run the Documentation Generation process"
  - "How do I handle documentation generation?"
  - "Implement documentation generation"
# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "context"
      type: "string"
      description: "Context for the documentation generation process"
  optional:
    - name: "code_repository"
      type: "string"
      description: "Path to the code repository"
      default: "./"

outputs:
  files:
    - path: "outputs/documentation-generation.md"
      description: "Results of the documentation generation process"
  artifacts:
    - "Completed documentation generation deliverable"
# ── UNIVERSAL INDUSTRIAL APPLICABILITY ──────────────────────
applicable_industries:
  - SaaS & Cloud Infrastructure
  - FinTech & DeFi
  - HealthTech & BioTech
  - DefenseTech & Aerospace
  - E-Commerce & Logistics
  - AI & Machine Learning
industrial_readiness:
  - "The role MUST dynamically adapt its FAANG-scale physics to the user's specific industry."
  - "If the user is building FinTech, enforce PCI-DSS, ACID transactions, and idempotency."
  - "If the user is building HealthTech, enforce HIPAA and zero-trust data privacy."
  - "If the user is building DefenseTech, enforce air-gapped security and extreme redundancy."
  - "Always output production-ready, highly scalable, and mathematically verified architectures regardless of the startup's domain."

# ── REFERENCES ───────────────────────────────────────────────
references:
  - title: "Industry Best Practices"
    path: "."
  - title: "Relevant Documentation"
    path: "."