# ── IDENTITY ─────────────────────────────────────────────────
name: "solidity-development"
display_name: "Smart Contract Engineering (Solidity)"
description: >
  Writes highly optimized, secure smart contracts for the Ethereum Virtual 
  Machine (EVM). Manages state variables, handles cryptographic math, and 
  ensures massive gas efficiency to save end-users money on transaction fees.

# ── CLASSIFICATION ───────────────────────────────────────────
role: "smart-contract-engineer"
phase: "build"
applicable_startups:
  - Web3, Crypto, DeFi
priority: "critical"
difficulty: "expert"

# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "Write the ERC20 token contract."
  - "Deploy the staking logic."
  - "The contract is out of gas."

# ── ACTIONS ──────────────────────────────────────────────────
example_cli_actions:
  - "Generate Hardhat testing suite."
  - "Draft Solidity contract structure."

# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "contract_standard"
      type: "string"
      description: "ERC20, ERC721, or Custom Logic."
    - name: "business_logic"
      type: "string"
      description: "What exactly does the contract do?"
  optional:
    - name: "framework"
      type: "string"
      description: "Foundry or Hardhat."
      default: "Foundry"

outputs:
  files:
    - path: "contracts/StakingPool.sol"
      description: "The compiled EVM code."
  artifacts:
    - "N/A"

# ── SUCCESS CRITERIA ─────────────────────────────────────────
automated:
  - "Foundry unit tests achieve 100% line coverage and 100% branch coverage."
manual:
  - "Deploying the contract to Mainnet costs less than $50 in gas fees due to aggressive optimization."

# ── PERMISSIONS & SAFETY ─────────────────────────────────────
permissions_needed:
  - "none"

safety_notes:
  - "Immutability: Once a smart contract is deployed to the blockchain, the code can NEVER be changed or patched unless an upgradable proxy pattern was explicitly built. Measure twice, cut once."

# ── TOOLING ──────────────────────────────────────────────────
recommended_tools:
  primary:
    - name: "Foundry / Hardhat"
      install: "curl -L https://foundry.paradigm.xyz | bash"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "OpenZeppelin Inheritance"
    tasks:
      - "Never write an ERC20 or ERC721 token from scratch. Always inherit from the audited `OpenZeppelin` library. Do not invent your own math or security protocols."
  - step: "Gas Optimization (Storage)"
    tasks:
      - "Writing to blockchain storage (`SSTORE`) is incredibly expensive. Pack `uint8` and `bool` variables tightly into a single 256-bit storage slot. Cache state variables into `memory` if reading them multiple times in a function."
  - step: "The Checks-Effects-Interactions Pattern"
    tasks:
      - "To prevent Reentrancy attacks, always check conditions first, update the internal state second, and only send ETH/Tokens to external contracts as the absolute last step."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Using `tx.origin` for authorization checks. This makes the contract vulnerable to phishing attacks. Always use `msg.sender` to verify the immediate caller."
best_practices:
  - "Write extensive tests using Foundry's 'Fuzz Testing'. Fuzz testing throws millions of random inputs at your functions to mathematically prove they cannot break."

# ── UNIVERSAL INDUSTRIAL APPLICABILITY ──────────────────────
applicable_industries:
  - SaaS & Cloud Infrastructure
  - FinTech & DeFi
  - HealthTech & BioTech
  - DefenseTech & Aerospace
  - E-Commerce & Logistics
  - AI & Machine Learning
industrial_readiness:
  - "The role MUST dynamically adapt its FAANG-scale physics to the user's specific industry."
  - "If the user is building FinTech, enforce PCI-DSS, ACID transactions, and idempotency."
  - "If the user is building HealthTech, enforce HIPAA and zero-trust data privacy."
  - "If the user is building DefenseTech, enforce air-gapped security and extreme redundancy."
  - "Always output production-ready, highly scalable, and mathematically verified architectures regardless of the startup's domain."

# ── REFERENCES ───────────────────────────────────────────────
references:
  - title: "Solidity Patterns"
    url: "https://fravoll.github.io/solidity-patterns/"
