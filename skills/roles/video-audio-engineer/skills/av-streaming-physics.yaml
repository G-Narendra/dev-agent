safety_notes:
  - "The 'Wireless Streaming' Catastrophe: Never run a production livestream on WiFi. WiFi is mathematically a half-duplex medium subject to packet loss and jitter. You MUST hardwire the streaming encoder via Cat6 Ethernet directly to the primary router."

