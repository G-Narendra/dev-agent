      install: "N/A"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "Strict Bitrate vs Upload Physics"
    tasks:
      - "Eradicate random bitrate guessing. If your upload speed is 10 Mbps, setting the stream bitrate to 10 Mbps mathematically guarantees catastrophic buffering. You MUST enforce the 50% Rule: Never stream at a bitrate higher than 50-60% of your sustained upload speed to account for network fluctuations."
  - step: "Audio/Video Desync (Latency Alignment)"
    tasks:
      - "Video processing mathematically takes longer than audio processing. If you plug a microphone directly into the computer and a camera through a capture card, the audio will hit the stream 150ms before the lips move. You MUST measure the video delay and mathematically apply a matching 'Sync Offset' to the audio source."
  - step: "Hardware vs Software Encoding"
    tasks:
      - "Do not use x264 (CPU encoding) on a laptop without a dedicated GPU. It will thermally throttle and drop frames. You MUST use hardware encoders (NVENC for NVIDIA, VideoToolbox for Apple Silicon) to offload the mathematical heavy lifting of H.264 compression."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Mismatched Frame Rates: Feeding a 24fps camera into a 60fps OBS canvas, and streaming at 30fps. The frame interpolation will mathematically cause stuttering (judder). You MUST unify the pipeline: Camera at 30fps -> OBS at 30fps -> Stream at 30fps."

best_practices:
  - "Implement strict 'SRT (Secure Reliable Transport)'. When streaming over unpredictable networks (e.g., cellular bonding from the field to a studio), do not use RTMP. You MUST use SRT, which mathematically recovers lost packets and ensures pristine video quality over dirty networks."

