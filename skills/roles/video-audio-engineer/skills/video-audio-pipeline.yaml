# ── IDENTITY ─────────────────────────────────────────────────
name: "video-audio-pipeline"
display_name: "Video & Audio Engineering Pipeline"
description: >
  Builds media processing infrastructure for video and audio content. 
  Handles encoding, transcoding, streaming, adaptive bitrate delivery, 
  audio processing, and content delivery optimization.

# ── CLASSIFICATION ───────────────────────────────────────────
role: "video-audio-engineer"
phase: "build"
applicable_startups:
  - media-creator
priority: "high"
difficulty: "advanced"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "Video Pipeline"
    tasks:
      - "Design video upload and transcoding pipeline."
      - "Implement adaptive bitrate streaming (HLS/DASH)."
  - step: "Audio Processing"
    tasks:
      - "Build audio normalization and enhancement pipeline."
      - "Implement speech-to-text for captions/search."
  - step: "CDN & Delivery"
    tasks:
      - "Set up CDN distribution for global low-latency delivery."
      - "Implement DRM and content protection if needed."

# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "Run the Video Audio Pipeline process"
  - "How do I handle video audio pipeline?"
  - "Implement video audio pipeline"
  - "Builds media processing infrastructure for video and audio content"
# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "context"
      type: "string"
      description: "Context for the video audio pipeline process"
  optional:
    - name: "N/A"
      type: "string"
      description: "No optional inputs needed."

outputs:
  files:
    - path: "outputs/video-audio-pipeline.md"
      description: "Results of the video audio pipeline process"
  artifacts:
    - "Completed video audio pipeline deliverable"
# ── QUALITY GATES ────────────────────────────────────────────
best_practices:
  - "Document decisions and rationale for future reference."
  - "Test assumptions early and iterate based on feedback."
  - "Keep security and compliance in mind from the start — retrofitting is expensive."
anti_patterns:
  - "Transcoding on the main application server — use a dedicated media server or serverless."
  - "Storing only one resolution — adaptive bitrate streaming is table stakes."
  - "Not considering content delivery costs — bandwidth can eat your margins."
