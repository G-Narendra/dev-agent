# ── IDENTITY ─────────────────────────────────────────────────
name: "site-reliability-engineering"
display_name: "SLI, SLO, and Error Budget Setup"
description: >
  Define Service Level Indicators (SLIs), Service Level Objectives (SLOs), and Error Budgets
  to quantitatively manage the tradeoff between reliability and feature velocity.

# ── CLASSIFICATION ───────────────────────────────────────────
role: "sre-engineer"
phase: "ship"
applicable_startups: 
  - all
priority: "mvp"
difficulty: "advanced"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "SLI Definition"
    tasks:
      - "Identify the primary user journeys (e.g., Login, Checkout)."
      - "Define metrics to measure them (e.g., 'HTTP 200 responses < 200ms')."
  - step: "SLO Target"
    tasks:
      - "Set a realistic target based on business needs (e.g., 99.9% of requests over 30 days)."
  - step: "Error Budget Policy"
    tasks:
      - "Draft an agreement: If the error budget is depleted, all feature work stops until reliability is restored."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Setting an SLO of 100% — it is mathematically impossible over the long term and creates a culture of fear."

best_practices:
  - "Document decisions and rationale for future reference."
  - "Test assumptions early and iterate based on feedback."
  - "Keep security and compliance in mind from the start -- retrofitting is expensive."
# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "Run the Site Reliability Engineering process"
  - "How do I handle site reliability engineering?"
  - "Implement site reliability engineering"
# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "context"
      type: "string"
      description: "Context for the site reliability engineering process"
  optional:
    - name: "N/A"
      type: "string"
      description: "No optional inputs needed."

outputs:
  files:
    - path: "outputs/site-reliability-engineering.md"
      description: "Results of the site reliability engineering process"
  artifacts:
    - "Completed site reliability engineering deliverable"
# ── UNIVERSAL INDUSTRIAL APPLICABILITY ──────────────────────
applicable_industries:
  - SaaS & Cloud Infrastructure
  - FinTech & DeFi
  - HealthTech & BioTech
  - DefenseTech & Aerospace
  - E-Commerce & Logistics
  - AI & Machine Learning
industrial_readiness:
  - "The role MUST dynamically adapt its FAANG-scale physics to the user's specific industry."
  - "If the user is building FinTech, enforce PCI-DSS, ACID transactions, and idempotency."
  - "If the user is building HealthTech, enforce HIPAA and zero-trust data privacy."
  - "If the user is building DefenseTech, enforce air-gapped security and extreme redundancy."
  - "Always output production-ready, highly scalable, and mathematically verified architectures regardless of the startup's domain."

# ── REFERENCES ───────────────────────────────────────────────
references:
  - title: "Industry Best Practices"
    path: "."
  - title: "Relevant Documentation"
    path: "."