# ── IDENTITY ─────────────────────────────────────────────────
name: "brand-positioning"
display_name: "Brand Positioning & Messaging Strategy"
description: >
  Defines *how* the startup talks about itself. Crafts the unique value 
  proposition, identifies the core enemy (what the brand stands against), 
  and ensures the company doesn't sound like a generic corporate robot.

# ── CLASSIFICATION ───────────────────────────────────────────
role: "marketing-manager"
phase: "planning"
applicable_startups:
  - all
priority: "high"
difficulty: "advanced"

# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "Why are we different from our competitors?"
  - "Write the brand guidelines."
  - "The homepage copy is confusing."

# ── ACTIONS ──────────────────────────────────────────────────
example_cli_actions:
  - "Draft brand messaging house."
  - "Generate competitor analysis."

# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "target_audience"
      type: "string"
      description: "Who are we speaking to?"
    - name: "core_value"
      type: "string"
      description: "What is the #1 benefit we provide?"
  optional:
    - name: "brand_archetype"
      type: "string"
      description: "The Rebel, The Hero, The Sage, etc."
      default: "The Creator"

outputs:
  files:
    - path: "marketing/brand/messaging_guide.md"
      description: "The source of truth for all copywriting."
  artifacts:
    - "N/A"

# ── SUCCESS CRITERIA ─────────────────────────────────────────
automated:
  - "N/A"
manual:
  - "When 5 different employees are asked 'What does your company do?', they all give the exact same 1-sentence answer."

# ── PERMISSIONS & SAFETY ─────────────────────────────────────
permissions_needed:
  - "none"

safety_notes:
  - "Over-promising: Do not position the brand as a 'fully automated AI solution' if there is actually a team of humans doing the work in the background. If users find out, brand trust drops to zero."

# ── TOOLING ──────────────────────────────────────────────────
recommended_tools:
  primary:
    - name: "Notion (For documentation)"
      install: "N/A"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "The One-Liner"
    tasks:
      - "Create a strict 1-sentence description of the company using this format: 'We help [Target Audience] achieve [Desired Result] by doing [Unique Mechanism]'."
  - step: "Identify the Enemy"
    tasks:
      - "Great brands stand *against* something. E.g., Slack stood against email. Apple stood against the PC establishment. Explicitly define what the old, broken way of doing things is."
  - step: "Tone of Voice"
    tasks:
      - "Establish the brand voice. Is it sarcastic and punchy? Is it highly academic and reassuring? Provide 3 examples of 'How we say it' vs 'How we don't say it'."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Using meaningless corporate jargon: 'We are a synergistic, paradigm-shifting, holistic AI platform'. This means absolutely nothing to the customer. Speak like a normal human."
best_practices:
  - "Focus on the transformation, not the features. People don't buy a drill because they want a drill; they buy it because they want a hole in the wall. Position the brand around the hole."

# ── UNIVERSAL INDUSTRIAL APPLICABILITY ──────────────────────
applicable_industries:
  - SaaS & Cloud Infrastructure
  - FinTech & DeFi
  - HealthTech & BioTech
  - DefenseTech & Aerospace
  - E-Commerce & Logistics
  - AI & Machine Learning
industrial_readiness:
  - "The role MUST dynamically adapt its FAANG-scale physics to the user's specific industry."
  - "If the user is building FinTech, enforce PCI-DSS, ACID transactions, and idempotency."
  - "If the user is building HealthTech, enforce HIPAA and zero-trust data privacy."
  - "If the user is building DefenseTech, enforce air-gapped security and extreme redundancy."
  - "Always output production-ready, highly scalable, and mathematically verified architectures regardless of the startup's domain."

# ── REFERENCES ───────────────────────────────────────────────
references:
  - title: "April Dunford: Obviously Awesome"
    url: "https://www.aprildunford.com/obviously-awesome"
