# ── IDENTITY ─────────────────────────────────────────────────
name: "earnings-calls"
display_name: "Earnings Call Preparation & Execution"
description: >
  Draft the quarterly earnings script, prepare executives for hostile analyst Q&A, 
  and ensure all financial disclosures comply with SEC regulations.

# ── CLASSIFICATION ───────────────────────────────────────────
role: "investor-relations-manager"
phase: "growth"
applicable_startups: 
  - enterprise
priority: "mvp"
difficulty: "expert"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "Scripting"
    tasks:
      - "Draft the CEO's strategic overview and the CFO's deep-dive financial script."
  - step: "Q&A Defense"
    tasks:
      - "Compile a 'Murder Board' of the 20 most difficult questions analysts are likely to ask regarding churn or margin compression."
      - "Run mock Q&A sessions with the executives."
  - step: "Disclosure"
    tasks:
      - "Coordinate with legal to issue the 8-K press release simultaneously with the call."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Allowing the CEO to go off-script during an earnings call and make an unauthorized forward-looking statement."

best_practices:
  - "Document decisions and rationale for future reference."
  - "Test assumptions early and iterate based on feedback."
  - "Keep security and compliance in mind from the start -- retrofitting is expensive."
# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "Run the Earnings Calls process"
  - "How do I handle earnings calls?"
  - "Implement earnings calls"
# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "context"
      type: "string"
      description: "Context for the earnings calls process"
  optional:
    - name: "data_source"
      type: "string"
      description: "Source of data to analyze"
      default: "Internal data"

outputs:
  files:
    - path: "outputs/earnings-calls.md"
      description: "Results of the earnings calls process"
  artifacts:
    - "Completed earnings calls deliverable"
# ── UNIVERSAL INDUSTRIAL APPLICABILITY ──────────────────────
applicable_industries:
  - SaaS & Cloud Infrastructure
  - FinTech & DeFi
  - HealthTech & BioTech
  - DefenseTech & Aerospace
  - E-Commerce & Logistics
  - AI & Machine Learning
industrial_readiness:
  - "The role MUST dynamically adapt its FAANG-scale physics to the user's specific industry."
  - "If the user is building FinTech, enforce PCI-DSS, ACID transactions, and idempotency."
  - "If the user is building HealthTech, enforce HIPAA and zero-trust data privacy."
  - "If the user is building DefenseTech, enforce air-gapped security and extreme redundancy."
  - "Always output production-ready, highly scalable, and mathematically verified architectures regardless of the startup's domain."

# ── REFERENCES ───────────────────────────────────────────────
references:
  - title: "Industry Best Practices"
    path: "."
  - title: "Relevant Documentation"
    path: "."