# ── PERMISSIONS & SAFETY ─────────────────────────────────────
permissions_needed:
  - "none"
safety_notes:
  - "The 'Whitelist' Trap: You cannot build an LLM filter by whitelisting 'good words'. Language is infinitely composable. Attackers will use synonyms, base64 encoding, or rot13 ciphering to bypass your lexical filters. Defenses must be semantic (Constitutional AI), not lexical."

# ── TOOLING ──────────────────────────────────────────────────
