  - "Break the LLM."
  - "Test for prompt injections."
  - "Extract the system prompt."
  - "Red team the chatbot."

# ── ACTIONS ──────────────────────────────────────────────────
example_cli_actions:
  - "Execute Garak Vulnerability Scan."
  - "Generate Adversarial Token Sequences."

# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "target_endpoint"
      type: "string"
      description: "The AI API to attack."
  optional:
    - name: "attack_vector"
      type: "string"
      description: "Jailbreak, PII Leak, DOS."
      default: "Jailbreak"

outputs:
