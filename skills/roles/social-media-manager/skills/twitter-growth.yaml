# ── IDENTITY ─────────────────────────────────────────────────
name: "twitter-growth"
display_name: "X (Twitter) & LinkedIn Audience Growth"
description: >
  Builds organic social media presence without paying for ads. Masters the art 
  of algorithm-friendly threads, engagement bait (the good kind), and 
  establishing the founders as thought leaders in their specific niche.

# ── CLASSIFICATION ───────────────────────────────────────────
role: "social-media-manager"
phase: "growth"
applicable_startups:
  - all
priority: "high"
difficulty: "advanced"

# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "We need to build our founder's personal brand."
  - "Write a Twitter thread."
  - "Grow our LinkedIn following."

# ── ACTIONS ──────────────────────────────────────────────────
example_cli_actions:
  - "Draft 10-part Twitter thread."
  - "Generate 30-day content calendar."

# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "core_topic"
      type: "string"
      description: "What is the account about? (e.g., Bootstrapping SaaS)."
  optional:
    - name: "platform"
      type: "string"
      description: "Twitter (X) or LinkedIn."
      default: "Twitter (X)"

outputs:
  files:
    - path: "marketing/social/q1_content_calendar.md"
      description: "The schedule of posts and threads."
  artifacts:
    - "N/A"

# ── SUCCESS CRITERIA ─────────────────────────────────────────
automated:
  - "N/A"
manual:
  - "A single thread generates over 500k impressions and drives 100+ qualified leads to the startup's landing page."

# ── PERMISSIONS & SAFETY ─────────────────────────────────────
permissions_needed:
  - "none"

safety_notes:
  - "Engagement Pods: Do not use automated engagement pods (buying fake likes/retweets from bots). The algorithms are smart enough to detect this and will shadowban the account's reach."

# ── TOOLING ──────────────────────────────────────────────────
recommended_tools:
  primary:
    - name: "Typefully / Hypefury"
      install: "N/A"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "The Profile Funnel"
    tasks:
      - "Optimize the profile before tweeting. The bio must explain exactly what value a follower will get. The pinned tweet should be your highest-performing thread, and the bio link must go to a lead capture page."
  - step: "High-Value Threads"
    tasks:
      - "Once a week, drop a massive 'Value Bomb' thread. Don't hold back secrets. E.g., 'How we scaled to $1M ARR (Step by step with screenshots)'. The hook (Tweet 1) is 80% of the battle."
  - step: "Outbound Engagement"
    tasks:
      - "If you have <1,000 followers, tweeting into the void does nothing. You must spend 30 minutes a day leaving highly insightful replies on the tweets of massive accounts in your niche to siphon their audience."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Tweeting purely promotional corporate links (e.g., 'We just published a new blog post! Click here.'). Social platforms actively suppress external links. Give the value *natively* in the post."
best_practices:
  - "Use the 'Auto-Plug' feature in tools like Typefully. Once a tweet hits 500 likes, automatically reply to it with a link to your startup's product. This maximizes conversion on viral posts."

# ── UNIVERSAL INDUSTRIAL APPLICABILITY ──────────────────────
applicable_industries:
  - SaaS & Cloud Infrastructure
  - FinTech & DeFi
  - HealthTech & BioTech
  - DefenseTech & Aerospace
  - E-Commerce & Logistics
  - AI & Machine Learning
industrial_readiness:
  - "The role MUST dynamically adapt its FAANG-scale physics to the user's specific industry."
  - "If the user is building FinTech, enforce PCI-DSS, ACID transactions, and idempotency."
  - "If the user is building HealthTech, enforce HIPAA and zero-trust data privacy."
  - "If the user is building DefenseTech, enforce air-gapped security and extreme redundancy."
  - "Always output production-ready, highly scalable, and mathematically verified architectures regardless of the startup's domain."

# ── REFERENCES ───────────────────────────────────────────────
references:
  - title: "Sahil Bloom: How to write a Twitter Thread"
    url: "https://www.sahilbloom.com/newsletter/how-to-write-a-killer-twitter-thread"
