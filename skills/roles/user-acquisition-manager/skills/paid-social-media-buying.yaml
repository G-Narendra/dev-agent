# ── IDENTITY ─────────────────────────────────────────────────
name: "paid-social-media-buying"
display_name: "Performance Ad Buying & ROAS Optimization"
description: >
  Manage paid user acquisition campaigns across Meta, TikTok, and Google Ads, optimizing
  for Return on Ad Spend (ROAS) and rapid creative testing.

# ── CLASSIFICATION ───────────────────────────────────────────
role: "user-acquisition-manager"
phase: "growth"
applicable_startups: 
  - consumer
  - gaming
priority: "mvp"
difficulty: "expert"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "Campaign Structuring"
    tasks:
      - "Structure campaigns broadly (letting the algorithm do the work) rather than creating 50 micro-targeted ad sets."
  - step: "Creative Testing"
    tasks:
      - "Run a weekly creative sprint: test 5 new video hooks. Kill the losers within 48 hours; scale the winners vertically."
  - step: "Measurement"
    tasks:
      - "Implement a Media Mix Modeling (MMM) or incrementality testing framework to measure true lift, rather than relying solely on Meta's heavily-biased in-platform reporting."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Continuing to spend $10,000 a day on an ad campaign that has a 0.5x ROAS just because 'we need to hit our monthly spend target to get the agency bonus'."

best_practices:
  - "Document decisions and rationale for future reference."
  - "Test assumptions early and iterate based on feedback."
  - "Keep security and compliance in mind from the start -- retrofitting is expensive."
# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "Run the Paid Social Media Buying process"
  - "How do I handle paid social media buying?"
  - "Implement paid social media buying"
# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "context"
      type: "string"
      description: "Context for the paid social media buying process"
  optional:
    - name: "target_audience"
      type: "string"
      description: "Target user or customer segment"
      default: "Primary user persona"

outputs:
  files:
    - path: "outputs/paid-social-media-buying.md"
      description: "Results of the paid social media buying process"
  artifacts:
    - "Completed paid social media buying deliverable"
# ── UNIVERSAL INDUSTRIAL APPLICABILITY ──────────────────────
applicable_industries:
  - SaaS & Cloud Infrastructure
  - FinTech & DeFi
  - HealthTech & BioTech
  - DefenseTech & Aerospace
  - E-Commerce & Logistics
  - AI & Machine Learning
industrial_readiness:
  - "The role MUST dynamically adapt its FAANG-scale physics to the user's specific industry."
  - "If the user is building FinTech, enforce PCI-DSS, ACID transactions, and idempotency."
  - "If the user is building HealthTech, enforce HIPAA and zero-trust data privacy."
  - "If the user is building DefenseTech, enforce air-gapped security and extreme redundancy."
  - "Always output production-ready, highly scalable, and mathematically verified architectures regardless of the startup's domain."

# ── REFERENCES ───────────────────────────────────────────────
references:
  - title: "Industry Best Practices"
    path: "."
  - title: "Relevant Documentation"
    path: "."