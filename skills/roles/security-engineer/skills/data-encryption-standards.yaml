# ── IDENTITY ─────────────────────────────────────────────────
name: "data-encryption-standards"
display_name: "Data Encryption & Cryptography Standards"
description: >
  Ensure sensitive data (PII, passwords, financial records) is mathematically 
  protected both At Rest (in the database) and In Transit (over the network). 
  Defines hashing algorithms, key management, and TLS requirements.

# ── CLASSIFICATION ───────────────────────────────────────────
role: "security-engineer"
phase: "operations"
applicable_startups:
  - all
priority: "critical"
difficulty: "advanced"

# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "How do we store passwords?"
  - "Encrypt the user data."
  - "Configure HTTPS/TLS."

# ── ACTIONS ──────────────────────────────────────────────────
example_cli_actions:
  - "Create an encryption standard artifact."

# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "data_type"
      type: "string"
      description: "Passwords vs PII (e.g., Social Security Numbers) vs General Data."
  optional:
    - name: "compliance_framework"
      type: "string"
      description: "HIPAA, PCI-DSS, or SOC2."
      default: "General Best Practice"

outputs:
  files:
    - path: "security/cryptography-standards.md"
      description: "The internal policy for handling sensitive data."
  artifacts:
    - "A configuration for AWS KMS (Key Management Service)."

# ── SUCCESS CRITERIA ─────────────────────────────────────────
success_criteria:
  automated:
    - "SSL Labs test scores the domain an 'A+' for TLS configuration."
  manual:
    - "If the database is stolen, the attacker cannot reverse-engineer user passwords or read sensitive PII without also stealing the separate KMS keys."

# ── PERMISSIONS & SAFETY ─────────────────────────────────────
permissions_needed:
  - "filesystem"

safety_notes:
  - "NEVER 'roll your own crypto'. Never invent a custom encryption algorithm. You will fail. Use industry-standard, peer-reviewed libraries (libsodium, bcrypt, AES-GCM)."

# ── TOOLING ──────────────────────────────────────────────────
recommended_tools:
  primary:
    - name: "AWS KMS / Let's Encrypt (TLS)"
      install: "N/A"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "Data in Transit (Network)"
    tasks:
      - "Enforce HTTPS everywhere. Use HSTS (HTTP Strict Transport Security) headers to prevent protocol downgrade attacks."
      - "Disable outdated protocols (TLS 1.0, TLS 1.1). Require TLS 1.2 or TLS 1.3 minimum."
  - step: "Password Hashing"
    tasks:
      - "Passwords must NEVER be encrypted (reversible). They must be HASHED (one-way)."
      - "Use `Argon2` or `Bcrypt`. Do NOT use MD5 or SHA-256 (they are too fast and easily broken by brute-force/rainbow tables)."
      - "Always use a unique 'Salt' for every user."
  - step: "Data at Rest (Storage)"
    tasks:
      - "Enable disk-level encryption on all databases (e.g., AWS RDS KMS encryption). This protects against physical theft of the hard drives."
  - step: "Application-Level Encryption (For PII)"
    tasks:
      - "For extreme sensitivity (e.g., Social Security Numbers), encrypt the specific database column at the application layer using AES-256-GCM before writing to the DB. The DB administrator should see ciphertext."
      - "Use a Key Management Service (AWS KMS) to handle the Envelope Encryption master keys. Do not hardcode encryption keys."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Storing the application-level encryption keys in the exact same database as the encrypted data. If an attacker gets a SQL dump, they get the data and the key to unlock it."
  - "Not rotating TLS certificates. Use automated tooling (Let's Encrypt / AWS ACM) to rotate certificates every 90 days. Manual rotation guarantees a production outage when someone forgets."

best_practices:
  - "When storing API keys (e.g., a user connects their Stripe account to your app), encrypt them using application-level encryption. If you must display the key back to the user, only show the last 4 characters (`sk_live_****1234`)."

# ── UNIVERSAL INDUSTRIAL APPLICABILITY ──────────────────────
applicable_industries:
  - SaaS & Cloud Infrastructure
  - FinTech & DeFi
  - HealthTech & BioTech
  - DefenseTech & Aerospace
  - E-Commerce & Logistics
  - AI & Machine Learning
industrial_readiness:
  - "The role MUST dynamically adapt its FAANG-scale physics to the user's specific industry."
  - "If the user is building FinTech, enforce PCI-DSS, ACID transactions, and idempotency."
  - "If the user is building HealthTech, enforce HIPAA and zero-trust data privacy."
  - "If the user is building DefenseTech, enforce air-gapped security and extreme redundancy."
  - "Always output production-ready, highly scalable, and mathematically verified architectures regardless of the startup's domain."

# ── REFERENCES ───────────────────────────────────────────────
references:
  - title: "OWASP: Cryptographic Storage Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html"
