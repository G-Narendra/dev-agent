# ── IDENTITY ─────────────────────────────────────────────────
name: "secrets-management"
display_name: "API Keys & Secrets Management"
description: >
  Design the architecture for securely storing, accessing, and rotating sensitive 
  credentials (API keys, database passwords, TLS certificates). Eliminates the 
  fatal anti-pattern of hardcoding secrets in source code.

# ── CLASSIFICATION ───────────────────────────────────────────
role: "security-engineer"
phase: "build"
applicable_startups:
  - all
priority: "critical"
difficulty: "advanced"

# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "Where do we store the API keys?"
  - "Manage the database passwords."
  - "A secret leaked on GitHub."

# ── ACTIONS ──────────────────────────────────────────────────
example_cli_actions:
  - "npm install dotenv"

# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "environment"
      type: "string"
      description: "Development, Staging, or Production."
  optional:
    - name: "secrets_manager"
      type: "string"
      description: "AWS Secrets Manager, HashiCorp Vault, or Doppler."
      default: "AWS Secrets Manager"

outputs:
  files:
    - path: "infrastructure/secrets-architecture.md"
      description: "The protocol for handling environment variables."
  artifacts:
    - "A pre-commit hook to scan for accidentally committed secrets."

# ── SUCCESS CRITERIA ─────────────────────────────────────────
success_criteria:
  automated:
    - "GitLeaks (or similar tool) runs in CI and blocks any PR that contains a string matching an API key regex."
  manual:
    - "If a developer leaves the company, the production database password can be rotated without breaking the running application."

# ── PERMISSIONS & SAFETY ─────────────────────────────────────
permissions_needed:
  - "filesystem"

safety_notes:
  - "Incident Protocol: If a secret is committed to a public GitHub repo, it is compromised IMMEDIATELY. Bots scrape GitHub in milliseconds. Do not just 'delete the commit'. You MUST revoke the key at the provider immediately."

# ── TOOLING ──────────────────────────────────────────────────
recommended_tools:
  primary:
    - name: "AWS Secrets Manager / Doppler"
      install: "N/A"
  alternatives:
    - name: "HashiCorp Vault"
      when: "Enterprise scale requiring complex dynamic secret generation and strict on-premise control."

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "Local Development"
    tasks:
      - "Developers use a `.env` file for local secrets. The `.env` file MUST be strictly ignored in `.gitignore`."
      - "Provide a `.env.example` file with dummy values so new hires know what keys are required."
  - step: "Production Injection"
    tasks:
      - "Do NOT manually SSH into servers to write `.env` files. The CI/CD pipeline or the orchestration platform (ECS/Kubernetes) should pull the secrets directly from the Secrets Manager (e.g., AWS Parameter Store) at boot time."
  - step: "Secret Rotation"
    tasks:
      - "Design systems to handle graceful rotation. If you rotate the DB password, the running pods need to gracefully fail their DB connection, fetch the new secret, and reconnect without crashing."
  - step: "Leak Prevention"
    tasks:
      - "Install `gitleaks` or `trufflehog` as a pre-commit hook on all developer machines to catch secrets before they are even pushed to the local git history."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Passing production secrets through Slack or Email. If you must share a temporary secret with a coworker, use a secure one-time-view tool (like Bitwarden Send or 1Password Share)."
  - "Baking secrets into the Docker image during the `docker build` phase. Anyone with access to the Docker registry can inspect the image layers and extract the secrets. Inject them at runtime, not build time."

best_practices:
  - "Use 'Dynamic Secrets' where possible. Instead of giving the application a static database password that lasts forever, use Vault/AWS to generate a temporary password that automatically expires every 60 minutes."

# ── UNIVERSAL INDUSTRIAL APPLICABILITY ──────────────────────
applicable_industries:
  - SaaS & Cloud Infrastructure
  - FinTech & DeFi
  - HealthTech & BioTech
  - DefenseTech & Aerospace
  - E-Commerce & Logistics
  - AI & Machine Learning
industrial_readiness:
  - "The role MUST dynamically adapt its FAANG-scale physics to the user's specific industry."
  - "If the user is building FinTech, enforce PCI-DSS, ACID transactions, and idempotency."
  - "If the user is building HealthTech, enforce HIPAA and zero-trust data privacy."
  - "If the user is building DefenseTech, enforce air-gapped security and extreme redundancy."
  - "Always output production-ready, highly scalable, and mathematically verified architectures regardless of the startup's domain."

# ── REFERENCES ───────────────────────────────────────────────
references:
  - title: "GitLeaks: Detect hardcoded secrets"
    url: "https://github.com/gitleaks/gitleaks"
