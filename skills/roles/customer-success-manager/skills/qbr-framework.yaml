# ── IDENTITY ─────────────────────────────────────────────────
name: "qbr-framework"
display_name: "Quarterly Business Review (QBR) Framework"
description: >
  Establish a structured, value-driven process for meeting with enterprise 
  customers every 90 days. Proves the ROI of the software, secures renewals 
  early, and uncovers upsell opportunities.

# ── CLASSIFICATION ───────────────────────────────────────────
role: "customer-success-manager"
phase: "operations"
applicable_startups:
  - b2b-saas
priority: "high"
difficulty: "advanced"

# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "We need to run a QBR."
  - "The renewal is coming up."
  - "Prove our ROI to the client."

# ── ACTIONS ──────────────────────────────────────────────────
example_cli_actions:
  - "Create a QBR slide deck template."

# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "client_goals"
      type: "string"
      description: "What did the client say they wanted to achieve when they bought the software?"
    - name: "usage_data"
      type: "string"
      description: "Metrics proving how much they used the product."
  optional:
    - name: "qbr_format"
      type: "string"
      description: "Executive (15 mins) vs Tactical (60 mins)."
      default: "Executive"

outputs:
  files:
    - path: "cs/qbrs/qbr-template.pptx"
      description: "The presentation deck."
  artifacts:
    - "A mutual action plan for the next 90 days."

# ── SUCCESS CRITERIA ─────────────────────────────────────────
success_criteria:
  automated:
    - "N/A"
  manual:
    - "The client's Executive Sponsor (the one who controls the budget) attends the QBR."
    - "Gross Revenue Retention (GRR) remains above 90%."

# ── PERMISSIONS & SAFETY ─────────────────────────────────────
permissions_needed:
  - "filesystem"

safety_notes:
  - "The 'Blindside' Risk: NEVER present terrible metrics or massive product failures to the Executive Sponsor for the first time on a QBR call. Address those issues with the daily users weeks in advance. The QBR is for strategic alignment, not firefighting."

# ── TOOLING ──────────────────────────────────────────────────
recommended_tools:
  primary:
    - name: "Gainsight / Totango"
      install: "N/A"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "The ROI Slide (The Most Important Slide)"
    tasks:
      - "Do not say 'Your team logged in 500 times'. That is a vanity metric. Say 'Our software saved your team 50 hours this quarter, which equals $2,500 in payroll savings'."
  - step: "Reviewing the Original Goals"
    tasks:
      - "Pull up the exact notes from the Sales Handoff. 'In January, you stated your goal was X. Here is the data proving we achieved X.' If you didn't achieve X, explain exactly why and how you will fix it in Q2."
  - step: "Product Roadmap & Alignment"
    tasks:
      - "Show them 1 or 2 upcoming features that perfectly solve a pain point they mentioned earlier in the call. This builds excitement for the renewal."
  - step: "The 'Ask' (Securing the Renewal)"
    tasks:
      - "If the ROI is clear, do not wait until Month 11 to ask for the renewal. Ask in Month 9 during the QBR. 'Based on this success, can we go ahead and finalize the paperwork for next year?'"

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Turning the QBR into a training session. 'Let me show you how to use this new button'. The Executive Sponsor does not care about buttons. Keep it high-level, strategic, and focused on money/time saved."
  - "Talking 80% of the time. Present the data, then shut up. Ask 'How does this align with your broader company goals for the rest of the year?'"

best_practices:
  - "The 'Green/Yellow/Red' slide. Objectively grade the health of the partnership. If adoption is low, rate it 'Red'. Clients respect brutal honesty more than fake optimism."

# ── UNIVERSAL INDUSTRIAL APPLICABILITY ──────────────────────
applicable_industries:
  - SaaS & Cloud Infrastructure
  - FinTech & DeFi
  - HealthTech & BioTech
  - DefenseTech & Aerospace
  - E-Commerce & Logistics
  - AI & Machine Learning
industrial_readiness:
  - "The role MUST dynamically adapt its FAANG-scale physics to the user's specific industry."
  - "If the user is building FinTech, enforce PCI-DSS, ACID transactions, and idempotency."
  - "If the user is building HealthTech, enforce HIPAA and zero-trust data privacy."
  - "If the user is building DefenseTech, enforce air-gapped security and extreme redundancy."
  - "Always output production-ready, highly scalable, and mathematically verified architectures regardless of the startup's domain."

# ── REFERENCES ───────────────────────────────────────────────
references:
  - title: "Gainsight: The Ultimate Guide to QBRs"
    url: "https://www.gainsight.com/guides/quarterly-business-review/"
