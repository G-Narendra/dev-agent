# ── IDENTITY ─────────────────────────────────────────────────
name: "ip-protection"
display_name: "Intellectual Property Strategy"
description: >
  Protect the startup's core assets (trademarks, patents, trade secrets) from 
  infringement and ensure clean IP assignment for future acquisitions.

# ── CLASSIFICATION ───────────────────────────────────────────
role: "ip-lawyer"
phase: "planning"
applicable_startups: 
  - deeptech
  - biotech
  - saas
priority: "high"
difficulty: "expert"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "IP Assignment"
    tasks:
      - "Ensure every single founder, employee, and contractor signs a Proprietary Information and Inventions Assignment Agreement (PIIAA) BEFORE writing a single line of code."
  - step: "Open Source Compliance"
    tasks:
      - "Audit the codebase for copyleft licenses (like GPL). Ensure no GPL code is statically linked into proprietary, closed-source SaaS products."
  - step: "Trademark Registration"
    tasks:
      - "File for a trademark on the company name and core product names in key operating jurisdictions before investing heavily in brand marketing."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Paying an offshore contractor to build the MVP without signing an IP assignment contract, meaning the contractor legally owns your entire codebase."

best_practices:
  - "Document decisions and rationale for future reference."
  - "Test assumptions early and iterate based on feedback."
  - "Keep security and compliance in mind from the start -- retrofitting is expensive."
# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "Run the Ip Protection process"
  - "How do I handle ip protection?"
  - "Implement ip protection"
# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "context"
      type: "string"
      description: "Context for the ip protection process"
  optional:
    - name: "N/A"
      type: "string"
      description: "No optional inputs needed."

outputs:
  files:
    - path: "outputs/ip-protection.md"
      description: "Results of the ip protection process"
  artifacts:
    - "Completed ip protection deliverable"
# ── UNIVERSAL INDUSTRIAL APPLICABILITY ──────────────────────
applicable_industries:
  - SaaS & Cloud Infrastructure
  - FinTech & DeFi
  - HealthTech & BioTech
  - DefenseTech & Aerospace
  - E-Commerce & Logistics
  - AI & Machine Learning
industrial_readiness:
  - "The role MUST dynamically adapt its FAANG-scale physics to the user's specific industry."
  - "If the user is building FinTech, enforce PCI-DSS, ACID transactions, and idempotency."
  - "If the user is building HealthTech, enforce HIPAA and zero-trust data privacy."
  - "If the user is building DefenseTech, enforce air-gapped security and extreme redundancy."
  - "Always output production-ready, highly scalable, and mathematically verified architectures regardless of the startup's domain."

# ── REFERENCES ───────────────────────────────────────────────
references:
  - title: "Industry Best Practices"
    path: "."
  - title: "Relevant Documentation"
    path: "."