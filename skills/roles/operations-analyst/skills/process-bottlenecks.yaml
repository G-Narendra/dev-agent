# ── IDENTITY ─────────────────────────────────────────────────
name: "process-bottlenecks"
display_name: "Bottleneck Identification & Resolution"
description: >
  Analyze operational workflows (e.g., warehouse fulfillment, customer onboarding) using data 
  to identify constraints and implement efficiency improvements.

# ── CLASSIFICATION ───────────────────────────────────────────
role: "operations-analyst"
phase: "growth"
applicable_startups: 
  - all
priority: "mvp"
difficulty: "advanced"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "Process Mapping"
    tasks:
      - "Create a flowchart of the exact current state of the process, including all manual handoffs."
  - step: "Data Analysis"
    tasks:
      - "Measure the cycle time of each step. Identify the specific step causing the highest variance or delay (The Bottleneck)."
  - step: "Implementation"
    tasks:
      - "Propose a software automation or structural change to widen the bottleneck."
      - "Measure the cycle time post-implementation to verify the ROI."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Optimizing a step in the process that is NOT the bottleneck, resulting in zero improvement to the overall system throughput."

best_practices:
  - "Document decisions and rationale for future reference."
  - "Test assumptions early and iterate based on feedback."
  - "Keep security and compliance in mind from the start -- retrofitting is expensive."
# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "Run the Process Bottlenecks process"
  - "How do I handle process bottlenecks?"
  - "Implement process bottlenecks"
  - "Analyze operational workflows (e"
# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "context"
      type: "string"
      description: "Context for the process bottlenecks process"
  optional:
    - name: "data_source"
      type: "string"
      description: "Source of data to analyze"
      default: "Internal data"
    - name: "target_audience"
      type: "string"
      description: "Target user or customer segment"
      default: "Primary user persona"
    - name: "code_repository"
      type: "string"
      description: "Path to the code repository"
      default: "./"

outputs:
  files:
    - path: "outputs/process-bottlenecks.md"
      description: "Results of the process bottlenecks process"
  artifacts:
    - "Completed process bottlenecks deliverable"
# ── UNIVERSAL INDUSTRIAL APPLICABILITY ──────────────────────
applicable_industries:
  - SaaS & Cloud Infrastructure
  - FinTech & DeFi
  - HealthTech & BioTech
  - DefenseTech & Aerospace
  - E-Commerce & Logistics
  - AI & Machine Learning
industrial_readiness:
  - "The role MUST dynamically adapt its FAANG-scale physics to the user's specific industry."
  - "If the user is building FinTech, enforce PCI-DSS, ACID transactions, and idempotency."
  - "If the user is building HealthTech, enforce HIPAA and zero-trust data privacy."
  - "If the user is building DefenseTech, enforce air-gapped security and extreme redundancy."
  - "Always output production-ready, highly scalable, and mathematically verified architectures regardless of the startup's domain."

# ── REFERENCES ───────────────────────────────────────────────
references:
  - title: "Industry Best Practices"
    path: "."
  - title: "Relevant Documentation"
    path: "."