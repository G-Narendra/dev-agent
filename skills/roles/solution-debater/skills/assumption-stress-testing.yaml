# ── IDENTITY ─────────────────────────────────────────────────
name: "assumption-stress-testing"
display_name: "Strategic Assumption Stress Testing"
description: >
  Systematically dismantle the foundational assumptions of a startup idea (TAM, CAC, Moat) 
  through rigorous Socratic questioning to prevent building something nobody wants.

# ── CLASSIFICATION ───────────────────────────────────────────
role: "solution-debater"
phase: "ideation"
applicable_startups: 
  - all
priority: "mvp"
difficulty: "advanced"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "The Interrogation"
    tasks:
      - "Challenge the 'Why Now?': If this is such a good idea, why hasn't Google or a well-funded startup already built it?"
      - "Challenge the Distribution: Even if the product is great, how exactly will you acquire customers cheaper than the LTV?"
  - step: "Unit Economics Reality Check"
    tasks:
      - "Force the founder to build a bottom-up financial model to prove the business can actually generate a profit."
  - step: "Pivot Identification"
    tasks:
      - "If a fatal flaw is found, collaborate to pivot the idea slightly into a defensible adjacent market."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Being a contrarian just for the sake of being annoying, shooting down ideas without offering constructive paths to pivot or validate them."

best_practices:
  - "Document decisions and rationale for future reference."
  - "Test assumptions early and iterate based on feedback."
  - "Keep security and compliance in mind from the start -- retrofitting is expensive."
# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "Run the Assumption Stress Testing process"
  - "How do I handle assumption stress testing?"
  - "Implement assumption stress testing"
# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "context"
      type: "string"
      description: "Context for the assumption stress testing process"
  optional:
    - name: "N/A"
      type: "string"
      description: "No optional inputs needed."

outputs:
  files:
    - path: "outputs/assumption-stress-testing.md"
      description: "Results of the assumption stress testing process"
  artifacts:
    - "Completed assumption stress testing deliverable"
# ── UNIVERSAL INDUSTRIAL APPLICABILITY ──────────────────────
applicable_industries:
  - SaaS & Cloud Infrastructure
  - FinTech & DeFi
  - HealthTech & BioTech
  - DefenseTech & Aerospace
  - E-Commerce & Logistics
  - AI & Machine Learning
industrial_readiness:
  - "The role MUST dynamically adapt its FAANG-scale physics to the user's specific industry."
  - "If the user is building FinTech, enforce PCI-DSS, ACID transactions, and idempotency."
  - "If the user is building HealthTech, enforce HIPAA and zero-trust data privacy."
  - "If the user is building DefenseTech, enforce air-gapped security and extreme redundancy."
  - "Always output production-ready, highly scalable, and mathematically verified architectures regardless of the startup's domain."

# ── REFERENCES ───────────────────────────────────────────────
references:
  - title: "Industry Best Practices"
    path: "."
  - title: "Relevant Documentation"
    path: "."