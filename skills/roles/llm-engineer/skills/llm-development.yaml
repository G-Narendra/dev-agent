# ── IDENTITY ─────────────────────────────────────────────────
name: "llm-development"
display_name: "LLM Development & Integration"
description: >
  Specializes in developing, fine-tuning, and integrating Large Language Models 
  into production applications. Covers model selection, prompt engineering at 
  scale, RAG architectures, and LLM API optimization for cost and latency.

# ── CLASSIFICATION ───────────────────────────────────────────
role: "llm-engineer"
phase: "build"
applicable_startups:
  - ai
priority: "critical"
difficulty: "advanced"

# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "Integrate GPT into our app."
  - "We need an LLM-powered feature."
  - "Fine-tune a model on our data."

# ── ACTIONS ──────────────────────────────────────────────────
example_cli_actions:
  - "Design RAG pipeline."
  - "Optimize token usage."

# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "use_case"
      type: "string"
      description: "What the LLM should do (chat, summarization, extraction, etc.)"
    - name: "data_sources"
      type: "string"
      description: "Where the model retrieves context from"
  optional:
    - name: "model_provider"
      type: "string"
      description: "OpenAI, Anthropic, open-source"
      default: "OpenAI"

outputs:
  files:
    - path: "ai/llm/architecture.md"
      description: "LLM integration architecture"
  artifacts:
    - "A working LLM integration with cost/latency benchmarks"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "Model Selection"
    tasks:
      - "Choose the right model for the task (GPT-4 for reasoning, Claude for long context, open-source for cost)."
      - "Benchmark latency and cost across providers before committing."
  - step: "RAG Architecture"
    tasks:
      - "Design chunking strategy for documents."
      - "Set up vector database (Pinecone, Weaviate, pgvector)."
      - "Implement hybrid search (semantic + keyword)."
  - step: "Prompt Management"
    tasks:
      - "Version control all prompts in Git."
      - "Build an evaluation suite to test prompt changes."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Hardcoding prompts in application logic."
  - "Ignoring token costs during development."
best_practices:
  - "Always implement fallback behavior for when the LLM API is down."
  - "Cache common LLM responses to reduce costs."

# ── UNIVERSAL INDUSTRIAL APPLICABILITY ──────────────────────
applicable_industries:
  - SaaS & Cloud Infrastructure
  - FinTech & DeFi
  - HealthTech & BioTech
  - DefenseTech & Aerospace
  - E-Commerce & Logistics
  - AI & Machine Learning
industrial_readiness:
  - "The role MUST dynamically adapt its FAANG-scale physics to the user's specific industry."
  - "If the user is building FinTech, enforce PCI-DSS, ACID transactions, and idempotency."
  - "If the user is building HealthTech, enforce HIPAA and zero-trust data privacy."
  - "If the user is building DefenseTech, enforce air-gapped security and extreme redundancy."
  - "Always output production-ready, highly scalable, and mathematically verified architectures regardless of the startup's domain."

# ── REFERENCES ───────────────────────────────────────────────
references:
  - title: "Industry Best Practices"
    path: "."
  - title: "Relevant Documentation"
    path: "."