# ── IDENTITY ─────────────────────────────────────────────────
name: "sql-dashboarding"
display_name: "SQL & Business Intelligence Dashboarding"
description: >
  Write optimized SQL queries to extract KPIs from the production replica or data warehouse,
  and visualize them in a BI tool (Metabase, Superset, Redash).

# ── CLASSIFICATION ───────────────────────────────────────────
role: "data-analyst"
phase: "operations"
applicable_startups: 
  - all
priority: "mvp"
difficulty: "advanced"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "Metric Definition"
    tasks:
      - "Define the calculation for core metrics (e.g., MRR, Active Users, Churn Rate)."
  - step: "SQL Extraction"
    tasks:
      - "Write `SELECT` queries utilizing CTEs (`WITH` clauses) for readability."
      - "Use `DATE_TRUNC` to group data by day/week/month for time-series charts."
  - step: "Visualization"
    tasks:
      - "Build a 'Company Pulse' dashboard containing exactly 5 critical charts."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Querying the primary production database during peak hours, causing an application outage."

best_practices:
  - "Document decisions and rationale for future reference."
  - "Test assumptions early and iterate based on feedback."
  - "Keep security and compliance in mind from the start -- retrofitting is expensive."
# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "Run the Sql Dashboarding process"
  - "How do I handle sql dashboarding?"
  - "Implement sql dashboarding"
# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "context"
      type: "string"
      description: "Context for the sql dashboarding process"
  optional:
    - name: "data_source"
      type: "string"
      description: "Source of data to analyze"
      default: "Internal data"

outputs:
  files:
    - path: "outputs/sql-dashboarding.md"
      description: "Results of the sql dashboarding process"
  artifacts:
    - "Completed sql dashboarding deliverable"
# ── UNIVERSAL INDUSTRIAL APPLICABILITY ──────────────────────
applicable_industries:
  - SaaS & Cloud Infrastructure
  - FinTech & DeFi
  - HealthTech & BioTech
  - DefenseTech & Aerospace
  - E-Commerce & Logistics
  - AI & Machine Learning
industrial_readiness:
  - "The role MUST dynamically adapt its FAANG-scale physics to the user's specific industry."
  - "If the user is building FinTech, enforce PCI-DSS, ACID transactions, and idempotency."
  - "If the user is building HealthTech, enforce HIPAA and zero-trust data privacy."
  - "If the user is building DefenseTech, enforce air-gapped security and extreme redundancy."
  - "Always output production-ready, highly scalable, and mathematically verified architectures regardless of the startup's domain."

# ── REFERENCES ───────────────────────────────────────────────
references:
  - title: "Industry Best Practices"
    path: "."
  - title: "Relevant Documentation"
    path: "."