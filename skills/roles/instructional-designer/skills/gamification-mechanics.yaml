# ── IDENTITY ─────────────────────────────────────────────────
name: "gamification-mechanics"
display_name: "Gamification & Habit Loops"
description: >
  Apply game design mechanics (streaks, variable rewards, loss aversion) to 
  educational software to build daily active habits.

# ── CLASSIFICATION ───────────────────────────────────────────
role: "instructional-designer"
phase: "growth"
applicable_startups: 
  - edtech
  - consumer
priority: "high"
difficulty: "advanced"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "The Streak Mechanic"
    tasks:
      - "Implement a visible 'Daily Streak' counter. Allow users to freeze their streak for 1 day using earned virtual currency to mitigate the catastrophic churn that happens when a 100-day streak is broken."
  - step: "Variable Rewards"
    tasks:
      - "Do not give the exact same 'Good Job' badge every time. Use a loot-box style variable reward schedule where completing a hard lesson occasionally yields a rare cosmetic item."
  - step: "Cognitive Load Management"
    tasks:
      - "Keep interactive lessons under 3 minutes. If a concept requires more time, break it into two separate 'levels' to maintain the sense of rapid progression."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Adding a generic 'Leaderboard' to a B2B compliance training app, which just causes anxiety and resentment among employees rather than actually teaching them anything."

best_practices:
  - "Document decisions and rationale for future reference."
  - "Test assumptions early and iterate based on feedback."
  - "Keep security and compliance in mind from the start -- retrofitting is expensive."
# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "Run the Gamification Mechanics process"
  - "How do I handle gamification mechanics?"
  - "Implement gamification mechanics"
