# ── IDENTITY ─────────────────────────────────────────────────
name: "micro-interactions"
display_name: "Micro-Interactions & UI Animation"
description: >
  Design the subtle animations, hover states, and transitions that provide immediate feedback
  and elevate the perceived quality of the software.

# ── CLASSIFICATION ───────────────────────────────────────────
role: "interaction-designer"
phase: "build"
applicable_startups: 
  - consumer
  - saas
priority: "mvp"
difficulty: "advanced"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "State Definition"
    tasks:
      - "Design distinct states for every interactive element: Default, Hover, Focused, Active, Disabled."
  - step: "Motion Choreography"
    tasks:
      - "Define the easing curves (e.g., cubic-bezier) for UI transitions. Avoid linear animations which feel robotic."
      - "Keep standard transitions fast (under 200ms) to avoid making the app feel slow."
  - step: "Handoff"
    tasks:
      - "Provide developers with exact timing data or Lottie files to ensure the implementation matches the design exactly."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Making a button transition take 1 full second, infuriating users who just want to submit a form quickly."

best_practices:
  - "Document decisions and rationale for future reference."
  - "Test assumptions early and iterate based on feedback."
  - "Keep security and compliance in mind from the start -- retrofitting is expensive."
# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "Run the Micro Interactions process"
  - "How do I handle micro interactions?"
  - "Implement micro interactions"
# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "context"
      type: "string"
      description: "Context for the micro interactions process"
  optional:
    - name: "N/A"
      type: "string"
      description: "No optional inputs needed."

outputs:
  files:
    - path: "outputs/micro-interactions.md"
      description: "Results of the micro interactions process"
  artifacts:
    - "Completed micro interactions deliverable"
# ── UNIVERSAL INDUSTRIAL APPLICABILITY ──────────────────────
applicable_industries:
  - SaaS & Cloud Infrastructure
  - FinTech & DeFi
  - HealthTech & BioTech
  - DefenseTech & Aerospace
  - E-Commerce & Logistics
  - AI & Machine Learning
industrial_readiness:
  - "The role MUST dynamically adapt its FAANG-scale physics to the user's specific industry."
  - "If the user is building FinTech, enforce PCI-DSS, ACID transactions, and idempotency."
  - "If the user is building HealthTech, enforce HIPAA and zero-trust data privacy."
  - "If the user is building DefenseTech, enforce air-gapped security and extreme redundancy."
  - "Always output production-ready, highly scalable, and mathematically verified architectures regardless of the startup's domain."

# ── REFERENCES ───────────────────────────────────────────────
references:
  - title: "Industry Best Practices"
    path: "."
  - title: "Relevant Documentation"
    path: "."