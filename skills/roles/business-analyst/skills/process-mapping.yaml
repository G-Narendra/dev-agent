# ── IDENTITY ─────────────────────────────────────────────────
name: "process-mapping"
display_name: "Business Process Mapping (BPMN)"
description: >
  Creates visual flowcharts and state diagrams to map out complex business 
  logic, system integrations, and human-in-the-loop workflows before a 
  single line of code is written.

# ── CLASSIFICATION ───────────────────────────────────────────
role: "business-analyst"
phase: "planning"
applicable_startups:
  - b2b-saas
  - fintech
  - healthcare
priority: "high"
difficulty: "advanced"

# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "Map out the onboarding flow."
  - "How does the data move between these systems?"
  - "Draw a flowchart for the approval process."

# ── ACTIONS ──────────────────────────────────────────────────
example_cli_actions:
  - "Generate Mermaid.js flowchart."
  - "Draft BPMN logic."

# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "process_description"
      type: "string"
      description: "A text description of what happens in the workflow."
  optional:
    - name: "actors"
      type: "string"
      description: "The systems or people involved."
      default: "User, System"

outputs:
  files:
    - path: "docs/product/flows/onboarding-flow.md"
      description: "Markdown file containing a Mermaid diagram."
  artifacts:
    - "A rendered visual flowchart."

# ── SUCCESS CRITERIA ─────────────────────────────────────────
automated:
  - "The Mermaid syntax compiles without errors."
manual:
  - "Stakeholders can point to the visual diagram and instantly identify missing steps or bottlenecks."

# ── PERMISSIONS & SAFETY ─────────────────────────────────────
permissions_needed:
  - "none"

safety_notes:
  - "Ensure the diagram clearly delineates automated system tasks vs manual human tasks to avoid engineering misinterpretations."

# ── TOOLING ──────────────────────────────────────────────────
recommended_tools:
  primary:
    - name: "Mermaid.js"
      install: "N/A"
  alternatives:
    - name: "Lucidchart / FigJam"
      when: "Presenting to non-technical executives who prefer polished graphics."

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "Identify Actors (Swimlanes)"
    tasks:
      - "Determine who is involved. E.g., Customer, Payment Gateway, Internal Admin, Database."
  - step: "Map the 'Happy Path'"
    tasks:
      - "Draw the sequence of events when absolutely everything goes perfectly."
  - step: "Inject Decision Gateways"
    tasks:
      - "Add diamond-shaped decision nodes. E.g., 'Is Payment Successful?'. Create the branch for 'Yes' and the branch for 'No'."
  - step: "Mermaid Generation"
    tasks:
      - "Translate the logic into Mermaid syntax. Use `sequenceDiagram` for API/System interactions, and `flowchart TD` for user journeys."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Creating a 'Spaghetti Diagram' where lines cross over each other 50 times. Refactor the process or break it into sub-processes for readability."
best_practices:
  - "Keep diagrams under 15-20 nodes. If it is larger, it needs to be abstracted."

# ── UNIVERSAL INDUSTRIAL APPLICABILITY ──────────────────────
applicable_industries:
  - SaaS & Cloud Infrastructure
  - FinTech & DeFi
  - HealthTech & BioTech
  - DefenseTech & Aerospace
  - E-Commerce & Logistics
  - AI & Machine Learning
industrial_readiness:
  - "The role MUST dynamically adapt its FAANG-scale physics to the user's specific industry."
  - "If the user is building FinTech, enforce PCI-DSS, ACID transactions, and idempotency."
  - "If the user is building HealthTech, enforce HIPAA and zero-trust data privacy."
  - "If the user is building DefenseTech, enforce air-gapped security and extreme redundancy."
  - "Always output production-ready, highly scalable, and mathematically verified architectures regardless of the startup's domain."

# ── REFERENCES ───────────────────────────────────────────────
references:
  - title: "Mermaid.js Flowcharts"
    url: "https://mermaid.js.org/syntax/flowchart.html"
