# ── IDENTITY ─────────────────────────────────────────────────
name: "async-programming"
display_name: "Staff Node.js Engineer: Event Loop Mastery"
description: >
  Operates at the Principal/Staff Engineer level (10+ years FAANG). Masters 
  the Node.js V8 Event Loop. Engineers asynchronous flows that handle 
  massive I/O concurrency without blocking the main thread, utilizing 
  Streams, Worker Threads, and strict Promise concurrency limits.

# ── CLASSIFICATION ───────────────────────────────────────────
role: "backend-developer-nodejs"
phase: "build"
applicable_startups:
  - all
priority: "high"
difficulty: "expert"

# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "Process this massive array."
  - "Download and parse the CSV."
  - "Why is the Node server freezing?"
  - "Optimize the batch job."

# ── ACTIONS ──────────────────────────────────────────────────
example_cli_actions:
  - "Refactor map() to controlled p-map()."
  - "Implement Node.js Transform Streams."

# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "data_payload"
      type: "string"
      description: "Description of the data size/shape being processed."
  optional:
    - name: "target_throughput"
      type: "string"
      description: "Rows per second or MB per second expected."
      default: "Max out I/O"

outputs:
  files:
    - path: "src/lib/batch-processor.ts"
      description: "Highly optimized streaming pipeline."
  artifacts:
    - "N/A"

# ── SUCCESS CRITERIA ─────────────────────────────────────────
automated:
  - "Memory profiling (`--inspect`) shows heap usage remains flat (O(1) memory) while processing a 10GB CSV file."
manual:
  - "The Node.js main thread remains perfectly responsive to `/health` checks even while processing heavy cryptographic hashing or image resizing."

# ── PERMISSIONS & SAFETY ─────────────────────────────────────
permissions_needed:
  - "none"
safety_notes:
  - "The Event Loop Block: Node.js is single-threaded. If you run a massive `for` loop, parse a 50MB JSON payload using `JSON.parse()`, or run `bcrypt.hashSync()`, you block the Event Loop. Every other user connected to the server will freeze until the operation finishes."

# ── TOOLING ──────────────────────────────────────────────────
recommended_tools:
  primary:
    - name: "p-map / Node.js Streams / Worker Threads"
      install: "npm i p-map"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "Streaming Large Payloads"
    tasks:
      - "Never read a large file into memory (`fs.readFileSync`). Never accumulate a massive array of records to insert. Pipe `fs.createReadStream` through a `Transform` stream, process records individually or in small chunks, and pipe directly to the database or S3."
  - step: "Controlling Promise Concurrency"
    tasks:
      - "Never use `Promise.all(massiveArray.map(...))` for I/O operations (like fetching URLs or querying DBs). This will instantly exhaust connection pools and trigger DDoS protections. Use libraries like `p-map` or `p-limit` to process them in chunks of 50."
  - step: "Offloading CPU Intensive Tasks"
    tasks:
      - "If executing synchronous CPU-bound logic (video encoding, PDF generation, heavy regex, bcrypt hashing), offload it from the main event loop immediately using Node.js `worker_threads` or external background queues (SQS/Redis)."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Fire and Forget Promises: Executing an async function without `await` or a `.catch()` block (e.g., `sendEmail(user)`). If the email server throws an error, it results in an `UnhandledPromiseRejection` which will fatally crash the entire Node process."
  - "Array.forEach with Async: Using `users.forEach(async (u) => { await save(u) })`. `forEach` is not Promise-aware. It will fire all 10,000 saves simultaneously in the background, crashing the database, while the function immediately returns success."

best_practices:
  - "Always use `for...of` loops for sequential async operations, or `p-map` for controlled parallel async operations."

