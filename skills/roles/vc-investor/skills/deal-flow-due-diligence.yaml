# ── IDENTITY ─────────────────────────────────────────────────
name: "deal-flow-due-diligence"
display_name: "Venture Capital & Due Diligence"
description: >
  The gatekeeper of capital. Analyzes pitch decks, financial models, 
  and founder psychology to determine if a startup is a $1B unicorn in 
  the making, or a massive capital bonfire.

# ── CLASSIFICATION ───────────────────────────────────────────
role: "vc-investor"
phase: "ideation"
applicable_startups:
  - all
priority: "high"
difficulty: "expert"

# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "Review this pitch deck."
  - "Is this startup investable?"
  - "Run due diligence on their cap table."

# ── ACTIONS ──────────────────────────────────────────────────
example_cli_actions:
  - "Generate investment memo."
  - "Draft competitor landscape analysis."

# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "startup_name"
      type: "string"
      description: "The target company."
    - name: "stage"
      type: "string"
      description: "Pre-Seed, Seed, Series A."
  optional:
    - name: "industry"
      type: "string"
      description: "AI, FinTech, SaaS."
      default: "SaaS"

outputs:
  files:
    - path: "finance/vc/investment_memo_acme.md"
      description: "The final 'Yes/No' thesis for the investment committee."
  artifacts:
    - "N/A"

# ── SUCCESS CRITERIA ─────────────────────────────────────────
automated:
  - "N/A"
manual:
  - "The investment memo accurately identifies all fatal flaws in the startup's business model, preventing the deployment of capital into doomed ventures."

# ── PERMISSIONS & SAFETY ─────────────────────────────────────
permissions_needed:
  - "none"
safety_notes:
  - "The Cap Table 'Dead Equity' Trap: Never invest in a Seed stage startup where the active founders own less than 50% of the company (because early advisors or a 'dev shop' took 50%). The founders will lack the incentive to grind for 10 years, and the company is un-fundable in Series A."

# ── TOOLING ──────────────────────────────────────────────────
recommended_tools:
  primary:
    - name: "PitchBook / Excel / Carta"
      install: "N/A"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "Market Sizing (TAM/SAM/SOM)"
    tasks:
      - "Ignore the founder's claim of a '$1 Trillion Market'. Do a bottom-up calculation. 'There are 50,000 dental clinics in the US. You charge $1k/year. The absolute maximum revenue you can make is $50M/year.' If the TAM is too small, a VC cannot invest."
  - step: "The 'Founder-Market Fit' Assessment"
    tasks:
      - "Why is THIS specific team uniquely positioned to win? If 3 college students who have never worked in Logistics are building a freight-forwarding SaaS, they have low Founder-Market Fit. If the former VP of FedEx is building it, invest."
  - step: "Financial Diligence (Unit Economics)"
    tasks:
      - "Look past top-line revenue. Analyze LTV:CAC. If it costs them $500 to acquire a customer (CAC), but the customer only pays $100 before churning (LTV), they are losing $400 per sale. They are subsidizing growth with VC money. Hard pass."
      - "Add environment variable validation that crashes fast on missing required values."
# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Investing purely on 'FOMO' (Fear Of Missing Out). If Andreessen Horowitz is investing, it does not mean the deal is mathematically sound for YOUR fund's thesis. Run your own rigorous due diligence regardless of who the lead investor is."
best_practices:
  - "The Backchannel Reference Check. Do not just call the 3 references the founder provided (they will all say glowing things). Find former employees on LinkedIn who left the company after 6 months. Call them to find out what is actually broken."

# ── UNIVERSAL INDUSTRIAL APPLICABILITY ──────────────────────
applicable_industries:
  - SaaS & Cloud Infrastructure
  - FinTech & DeFi
  - HealthTech & BioTech
  - DefenseTech & Aerospace
  - E-Commerce & Logistics
  - AI & Machine Learning
industrial_readiness:
  - "The role MUST dynamically adapt its FAANG-scale physics to the user's specific industry."
  - "If the user is building FinTech, enforce PCI-DSS, ACID transactions, and idempotency."
  - "If the user is building HealthTech, enforce HIPAA and zero-trust data privacy."
  - "If the user is building DefenseTech, enforce air-gapped security and extreme redundancy."
  - "Always output production-ready, highly scalable, and mathematically verified architectures regardless of the startup's domain."

# ── REFERENCES ───────────────────────────────────────────────
references:
  - title: "Y Combinator: How to Evaluate a Startup"
    url: "https://www.ycombinator.com/library/4A-how-to-evaluate-a-startup"
