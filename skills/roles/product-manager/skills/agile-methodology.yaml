# ── IDENTITY ─────────────────────────────────────────────────
name: "agile-methodology"
display_name: "Agile & Sprint Planning"
description: >
  Runs the engineering team's execution cadence. Organizes work into 2-week 
  sprints, facilitates daily standups, and ensures that the team ships 
  incremental value rather than getting stuck in perpetual 'research phases'.

# ── CLASSIFICATION ───────────────────────────────────────────
role: "product-manager"
phase: "build"
applicable_startups:
  - all
priority: "critical"
difficulty: "advanced"

# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "The engineering team is moving too slowly."
  - "Organize the Jira board."
  - "Plan the next sprint."

# ── ACTIONS ──────────────────────────────────────────────────
example_cli_actions:
  - "Draft sprint backlog."
  - "Generate standup template."

# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "product_goals"
      type: "string"
      description: "The primary objectives for this sprint."
  optional:
    - name: "team_velocity"
      type: "string"
      description: "How many story points can the team complete?"
      default: "Unknown"

outputs:
  files:
    - path: "product/sprints/sprint-42-plan.md"
      description: "The finalized sprint commitments."
  artifacts:
    - "N/A"

# ── SUCCESS CRITERIA ─────────────────────────────────────────
automated:
  - "N/A"
manual:
  - "The sprint completes with 90%+ of committed story points delivered and merged to production."

# ── PERMISSIONS & SAFETY ─────────────────────────────────────
permissions_needed:
  - "none"

safety_notes:
  - "Scope Creep: Never allow the CEO or stakeholders to inject new feature requests into the middle of an active sprint. It destroys engineering morale and velocity. Add it to the backlog for the *next* sprint."

# ── TOOLING ──────────────────────────────────────────────────
recommended_tools:
  primary:
    - name: "Jira / Linear"
      install: "N/A"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "Backlog Grooming"
    tasks:
      - "Before sprint planning, ensure every ticket has a clear 'Definition of Done'. If a ticket says 'Build the login page', it is not ready for the sprint. It needs acceptance criteria."
  - step: "Timeboxing"
    tasks:
      - "Keep Agile ceremonies strictly timeboxed. Daily standup is 15 minutes. Sprint planning is 1 hour per week of sprint. Do not let these meetings turn into technical architecture debates."
  - step: "Retrospectives"
    tasks:
      - "At the end of the sprint, hold a retrospective. Ask: What went well? What went poorly? Identify exactly ONE process improvement to implement in the next sprint."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Using Story Points as a measure of time (e.g., '1 point = 1 day'). Points measure *complexity* and *risk*. If points equal time, just use hours."
best_practices:
  - "If an engineering task takes longer than 3 days, it is too big. Break the Jira ticket down into smaller, vertically sliced deliverables."

# ── UNIVERSAL INDUSTRIAL APPLICABILITY ──────────────────────
applicable_industries:
  - SaaS & Cloud Infrastructure
  - FinTech & DeFi
  - HealthTech & BioTech
  - DefenseTech & Aerospace
  - E-Commerce & Logistics
  - AI & Machine Learning
industrial_readiness:
  - "The role MUST dynamically adapt its FAANG-scale physics to the user's specific industry."
  - "If the user is building FinTech, enforce PCI-DSS, ACID transactions, and idempotency."
  - "If the user is building HealthTech, enforce HIPAA and zero-trust data privacy."
  - "If the user is building DefenseTech, enforce air-gapped security and extreme redundancy."
  - "Always output production-ready, highly scalable, and mathematically verified architectures regardless of the startup's domain."

# ── REFERENCES ───────────────────────────────────────────────
references:
  - title: "Atlassian: What is Agile?"
    url: "https://www.atlassian.com/agile"
