# ── IDENTITY ─────────────────────────────────────────────────
name: "database-administration"
display_name: "Database Administration & Tuning"
description: >
  Manage database infrastructure (PostgreSQL/MySQL), configure Point-in-Time Recovery (PITR),
  and tune memory settings (e.g., shared_buffers, work_mem) for optimal performance.

# ── CLASSIFICATION ───────────────────────────────────────────
role: "database-engineer"
phase: "build"
applicable_startups: 
  - all
priority: "mvp"
difficulty: "expert"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "Provisioning & High Availability"
    tasks:
      - "Deploy a managed RDS/Aurora instance with Multi-AZ enabled."
      - "Configure automated daily snapshots and 7-day PITR retention."
      - "Evaluate serverless PostgreSQL options like Neon (compute/storage separation, branching, scale-to-zero) for lower operational overhead."
  - step: "Security & Access"
    tasks:
      - "Ensure the database is completely inaccessible from the public internet."
      - "Create read-only replica credentials for analytical workloads."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Connecting directly to the primary database from a BI tool, causing production locking issues."

best_practices:
  - "Document decisions and rationale for future reference."
  - "Test assumptions early and iterate based on feedback."
  - "Keep security and compliance in mind from the start -- retrofitting is expensive."
# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "Run the Database Administration process"
  - "How do I handle database administration?"
  - "Implement database administration"
# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "context"
      type: "string"
      description: "Context for the database administration process"
  optional:
    - name: "data_source"
      type: "string"
      description: "Source of data to analyze"
      default: "Internal data"

outputs:
  files:
    - path: "outputs/database-administration.md"
      description: "Results of the database administration process"
  artifacts:
    - "Completed database administration deliverable"
# ── UNIVERSAL INDUSTRIAL APPLICABILITY ──────────────────────
applicable_industries:
  - SaaS & Cloud Infrastructure
  - FinTech & DeFi
  - HealthTech & BioTech
  - DefenseTech & Aerospace
  - E-Commerce & Logistics
  - AI & Machine Learning
industrial_readiness:
  - "The role MUST dynamically adapt its FAANG-scale physics to the user's specific industry."
  - "If the user is building FinTech, enforce PCI-DSS, ACID transactions, and idempotency."
  - "If the user is building HealthTech, enforce HIPAA and zero-trust data privacy."
  - "If the user is building DefenseTech, enforce air-gapped security and extreme redundancy."
  - "Always output production-ready, highly scalable, and mathematically verified architectures regardless of the startup's domain."

# ── REFERENCES ───────────────────────────────────────────────
references:
  - title: "Industry Best Practices"
    path: "."
  - title: "Relevant Documentation"
    path: "."