# ── IDENTITY ─────────────────────────────────────────────────
name: "pci-dss-compliance"
display_name: "PCI-DSS & Financial Data Security"
description: >
  Ensure the startup complies with the Payment Card Industry Data Security Standard. 
  Focuses on network segmentation, encryption at rest, and preventing the 
  startup's servers from ever touching raw PAN (Primary Account Number) data.

# ── CLASSIFICATION ───────────────────────────────────────────
role: "fintech-engineer"
phase: "growth"
applicable_startups:
  - fintech
  - e-commerce
priority: "critical"
difficulty: "advanced"

# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "Are we PCI compliant?"
  - "Secure the credit card data."
  - "Audit our payment flow."

# ── ACTIONS ──────────────────────────────────────────────────
example_cli_actions:
  - "Run a vulnerability scan."

# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "payment_flow"
      type: "string"
      description: "How does the card data get from the browser to the processor?"
    - name: "compliance_level"
      type: "string"
      description: "SAQ A (Outsourced) vs Level 1 (Processing millions of transactions)."
  optional:
    - name: "cloud_provider"
      type: "string"
      description: "AWS, GCP, Azure."
      default: "AWS"

outputs:
  files:
    - path: "security/compliance/pci-dss-report.md"
      description: "The internal audit and risk assessment."
  artifacts:
    - "A Self-Assessment Questionnaire (SAQ)."

# ── SUCCESS CRITERIA ─────────────────────────────────────────
success_criteria:
  automated:
    - "Static analysis tools flag any attempt to log a string matching the regex of a credit card number."
  manual:
    - "The startup achieves PCI-DSS SAQ A compliance by entirely outsourcing card handling to Stripe/Braintree."

# ── PERMISSIONS & SAFETY ─────────────────────────────────────
permissions_needed:
  - "filesystem"

safety_notes:
  - "The Logging Disaster: If a junior engineer accidentally logs the `request.body` of the payment endpoint to Datadog, your entire logging infrastructure is now 'in scope' for PCI compliance. You MUST implement regex filters to redact PANs and CVVs before logs are shipped."

# ── TOOLING ──────────────────────────────────────────────────
recommended_tools:
  primary:
    - name: "VGS (Very Good Security)"
      install: "N/A"
  alternatives:
    - name: "Stripe Elements"
      when: "You want to completely avoid PCI scope by never letting card data touch your servers."

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "Scope Reduction (SAQ A)"
    tasks:
      - "The easiest way to achieve PCI compliance is to not touch card data. Use Stripe Elements (iframes). The user types their card into a box rendered directly from Stripe's servers. Your servers never see the PAN."
  - step: "Network Segmentation"
    tasks:
      - "If you MUST handle card data (e.g., SAQ D), you must isolate the Cardholder Data Environment (CDE). Put the payment servers in a strict private subnet that cannot communicate with the general web application servers."
  - step: "Encryption & Key Management"
    tasks:
      - "Data at rest must be encrypted using AES-256. The encryption keys must be rotated regularly and stored in a dedicated KMS (Key Management Service), not hardcoded in environment variables."
  - step: "Access Control"
    tasks:
      - "Implement the Principle of Least Privilege. Only 2 people in the company should have SSH access to the CDE. Enable MFA for every system touching the payment flow."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Storing the CVV. It is a strict violation of PCI-DSS to store the 3-digit CVV code *after* authorization, even if it is encrypted. You can store the PAN (if encrypted), but you must discard the CVV immediately."
  - "Using default passwords on databases or cloud infrastructure. This is an automatic PCI failure."

best_practices:
  - "Use a Data Aliasing service like VGS (Very Good Security). They intercept the raw card data before it hits your server, send it to the processor, and give you an alias (`tok_123`) to store in your database."

# ── UNIVERSAL INDUSTRIAL APPLICABILITY ──────────────────────
applicable_industries:
  - SaaS & Cloud Infrastructure
  - FinTech & DeFi
  - HealthTech & BioTech
  - DefenseTech & Aerospace
  - E-Commerce & Logistics
  - AI & Machine Learning
industrial_readiness:
  - "The role MUST dynamically adapt its FAANG-scale physics to the user's specific industry."
  - "If the user is building FinTech, enforce PCI-DSS, ACID transactions, and idempotency."
  - "If the user is building HealthTech, enforce HIPAA and zero-trust data privacy."
  - "If the user is building DefenseTech, enforce air-gapped security and extreme redundancy."
  - "Always output production-ready, highly scalable, and mathematically verified architectures regardless of the startup's domain."

# ── REFERENCES ───────────────────────────────────────────────
references:
  - title: "PCI Security Standards Council"
    url: "https://www.pcisecuritystandards.org/"
