# ── IDENTITY ─────────────────────────────────────────────────
name: "marketplace-operations"
display_name: "Marketplace Operations Management"
description: >
  Manages the operational backbone of two-sided marketplaces. Handles 
  merchant onboarding, listing quality, transaction monitoring, fee 
  structures, and marketplace liquidity. Ensures both supply and demand 
  sides function smoothly.

# ── CLASSIFICATION ───────────────────────────────────────────
role: "marketplace-ops"
phase: "growth"
applicable_startups:
  - ecommerce
  - marketplace
priority: "high"
difficulty: "advanced"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "Merchant Onboarding"
    tasks:
      - "Design a streamlined seller onboarding flow with KYC verification."
      - "Set up listing approval workflows to maintain quality."
  - step: "Transaction Monitoring"
    tasks:
      - "Implement fee calculation (commission + fixed)."
      - "Set up payout scheduling and hold periods."
  - step: "Marketplace Liquidity"
    tasks:
      - "Monitor supply/demand ratios and identify gaps."
      - "Implement features to balance the marketplace (e.g., subsidies)."

# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "Run the Marketplace Operations process"
  - "How do I handle marketplace operations?"
  - "Implement marketplace operations"
  - "Manages the operational backbone of two-sided marketplaces"
# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "context"
      type: "string"
      description: "Context for the marketplace operations process"
  optional:
    - name: "N/A"
      type: "string"
      description: "No optional inputs needed."

outputs:
  files:
    - path: "outputs/marketplace-operations.md"
      description: "Results of the marketplace operations process"
  artifacts:
    - "Completed marketplace operations deliverable"
# ── QUALITY GATES ────────────────────────────────────────────
best_practices:
  - "Document decisions and rationale for future reference."
  - "Test assumptions early and iterate based on feedback."
  - "Keep security and compliance in mind from the start — retrofitting is expensive."
anti_patterns:
  - "Onboarding sellers without KYC verification — fraudsters will find your marketplace first."
  - "Setting commission fees that are too high on day one, scaring away early supply."
  - "Not monitoring supply/demand balance — a marketplace with no liquidity on one side will fail."
# ── UNIVERSAL INDUSTRIAL APPLICABILITY ──────────────────────
applicable_industries:
  - SaaS & Cloud Infrastructure
  - FinTech & DeFi
  - HealthTech & BioTech
  - DefenseTech & Aerospace
  - E-Commerce & Logistics
  - AI & Machine Learning
industrial_readiness:
  - "The role MUST dynamically adapt its FAANG-scale physics to the user's specific industry."
  - "If the user is building FinTech, enforce PCI-DSS, ACID transactions, and idempotency."
  - "If the user is building HealthTech, enforce HIPAA and zero-trust data privacy."
  - "If the user is building DefenseTech, enforce air-gapped security and extreme redundancy."
  - "Always output production-ready, highly scalable, and mathematically verified architectures regardless of the startup's domain."

# ── REFERENCES ───────────────────────────────────────────────
references:
  - title: "Industry Best Practices"
    path: "."
  - title: "Relevant Documentation"
    path: "."