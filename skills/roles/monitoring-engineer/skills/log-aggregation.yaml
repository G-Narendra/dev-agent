# ── IDENTITY ─────────────────────────────────────────────────
name: "log-aggregation"
display_name: "Centralized Log Aggregation & Parsing"
description: >
  Sets up a centralized log aggregation pipeline (ELK stack, Datadog, or Loki) 
  to collect, parse, and index logs from multiple distributed services. 
  Enforces structured JSON logging for queryability.

# ── CLASSIFICATION ───────────────────────────────────────────
role: "monitoring-engineer"
phase: "build"
applicable_startups:
  - all
priority: "high"
difficulty: "advanced"

# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "Where are the logs for the user service?"
  - "Set up ELK/Datadog logging."
  - "Centralize our logs."

# ── ACTIONS ──────────────────────────────────────────────────
example_cli_actions:
  - "Configure Fluentbit / Logstash shipper."
  - "Create log parsing grok patterns."

# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "log_sources"
      type: "config"
      description: "Where logs are coming from (Docker stdout, Kubernetes pods, files)."
  optional:
    - name: "retention_policy"
      type: "string"
      description: "How long to keep hot vs cold logs."
      default: "30 days hot, 1 year cold storage"

outputs:
  files:
    - path: "infrastructure/logging/fluentbit.conf"
      description: "The log shipper configuration."
  artifacts:
    - "A searchable log index (Kibana/Datadog UI)."

# ── SUCCESS CRITERIA ─────────────────────────────────────────
automated:
  - "Logs generated by a container appear in the central index within 5 seconds."
manual:
  - "Developers can search `user_id: 123` and see every log line generated for that user across 5 different microservices."

# ── PERMISSIONS & SAFETY ─────────────────────────────────────
permissions_needed:
  - "network"
  - "filesystem"

safety_notes:
  - "Data Sanitization: Ensure log shippers or the application itself strips out passwords, API keys, and credit card numbers BEFORE they are sent to the log aggregator."

# ── TOOLING ──────────────────────────────────────────────────
recommended_tools:
  primary:
    - name: "Datadog / Grafana Loki"
      install: "N/A"
  alternatives:
    - name: "ELK Stack (Elasticsearch, Logstash, Kibana)"
      when: "You are self-hosting for compliance or cost reasons."

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "Enforce Structured Logging (App Level)"
    tasks:
      - "Ensure all applications log in structured JSON, not raw text strings. E.g., `{\"level\":\"error\", \"message\":\"Failed login\", \"user_id\":123}`."
  - step: "Configure Log Shipper"
    tasks:
      - "Deploy a daemon (Fluentbit, Promtail, Datadog Agent) to every node to tail `stdout` and forward it to the aggregator."
  - step: "Metadata Enrichment"
    tasks:
      - "Configure the shipper to automatically append metadata to every log line: `environment: production`, `service: auth-api`, `host: ip-10-0-1-5`."
  - step: "Parsing and Indexing"
    tasks:
      - "If legacy systems produce raw text logs, write Grok patterns to parse them into JSON fields at the aggregator level."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Logging to local files on disk inside a Docker container. When the container restarts, the logs are gone forever. Always log to `stdout`."
  - "Paying to index DEBUG level logs in production. Drop DEBUG logs at the shipper level, or send them straight to cheap object storage (S3) instead of an expensive index (Elasticsearch)."

best_practices:
  - "Always include a `trace_id` in logs to correlate requests across microservice boundaries."

# ── UNIVERSAL INDUSTRIAL APPLICABILITY ──────────────────────
applicable_industries:
  - SaaS & Cloud Infrastructure
  - FinTech & DeFi
  - HealthTech & BioTech
  - DefenseTech & Aerospace
  - E-Commerce & Logistics
  - AI & Machine Learning
industrial_readiness:
  - "The role MUST dynamically adapt its FAANG-scale physics to the user's specific industry."
  - "If the user is building FinTech, enforce PCI-DSS, ACID transactions, and idempotency."
  - "If the user is building HealthTech, enforce HIPAA and zero-trust data privacy."
  - "If the user is building DefenseTech, enforce air-gapped security and extreme redundancy."
  - "Always output production-ready, highly scalable, and mathematically verified architectures regardless of the startup's domain."

# ── REFERENCES ───────────────────────────────────────────────
references:
  - title: "12 Factor App: Logs"
    url: "https://12factor.net/logs"
