# ── IDENTITY ─────────────────────────────────────────────────
name: "regulatory-compliance"
display_name: "Regulatory Compliance (GDPR/SOC2)"
description: >
  Ensure the startup legally complies with international data privacy laws (GDPR, CCPA) 
  and achieves necessary security certifications (SOC 2, HIPAA) to close enterprise deals.

# ── CLASSIFICATION ───────────────────────────────────────────
role: "compliance-officer"
phase: "growth"
applicable_startups: 
  - enterprise
  - fintech
  - healthtech
priority: "high"
difficulty: "expert"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "Data Mapping"
    tasks:
      - "Map out exactly where every piece of Personally Identifiable Information (PII) is stored, processed, and transmitted."
  - step: "Right to be Forgotten"
    tasks:
      - "Build an automated endpoint that allows users to instantly and permanently delete all their PII across all databases and third-party tools (Stripe/Mixpanel)."
  - step: "Audit Logging"
    tasks:
      - "Implement immutable audit logs that record every time an internal employee accesses sensitive customer data."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Hard-deleting a user from the primary Postgres database but completely forgetting to scrub their PII from the 5 years of logs stored in AWS S3."

best_practices:
  - "Document decisions and rationale for future reference."
  - "Test assumptions early and iterate based on feedback."
  - "Keep security and compliance in mind from the start -- retrofitting is expensive."
# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "Run the Regulatory Compliance process"
  - "How do I handle regulatory compliance?"
  - "Implement regulatory compliance"
# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "context"
      type: "string"
      description: "Context for the regulatory compliance process"
  optional:
    - name: "data_source"
      type: "string"
      description: "Source of data to analyze"
      default: "Internal data"

outputs:
  files:
    - path: "outputs/regulatory-compliance.md"
      description: "Results of the regulatory compliance process"
  artifacts:
    - "Completed regulatory compliance deliverable"
# ── UNIVERSAL INDUSTRIAL APPLICABILITY ──────────────────────
applicable_industries:
  - SaaS & Cloud Infrastructure
  - FinTech & DeFi
  - HealthTech & BioTech
  - DefenseTech & Aerospace
  - E-Commerce & Logistics
  - AI & Machine Learning
industrial_readiness:
  - "The role MUST dynamically adapt its FAANG-scale physics to the user's specific industry."
  - "If the user is building FinTech, enforce PCI-DSS, ACID transactions, and idempotency."
  - "If the user is building HealthTech, enforce HIPAA and zero-trust data privacy."
  - "If the user is building DefenseTech, enforce air-gapped security and extreme redundancy."
  - "Always output production-ready, highly scalable, and mathematically verified architectures regardless of the startup's domain."

# ── REFERENCES ───────────────────────────────────────────────
references:
  - title: "Industry Best Practices"
    path: "."
  - title: "Relevant Documentation"
    path: "."