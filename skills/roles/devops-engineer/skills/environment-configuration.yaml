# ── IDENTITY ─────────────────────────────────────────────────
name: "environment-configuration"
display_name: "Environment Variable & Config Management"
description: >
  Securely manage, validate, and inject environment variables across local, staging, 
  and production environments without ever committing secrets to Git.

# ── CLASSIFICATION ───────────────────────────────────────────
role: "devops-engineer"
phase: "build"
applicable_startups: 
  - all
priority: "high"
difficulty: "advanced"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "Runtime Validation"
    tasks:
      - "Use a schema validation library (e.g., Zod or Joi) to validate `process.env` immediately upon server boot, crashing the server if required keys are missing."
  - step: "Secret Injection"
    tasks:
      - "In production, inject secrets into the container at runtime using AWS Systems Manager Parameter Store or HashiCorp Vault."
  - step: "Local Syncing"
    tasks:
      - "Use tools like Doppler or Infisical so developers can sync local `.env` files without sharing them over Slack."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Deploying the server and waiting for a user to trigger an API call to discover that `STRIPE_SECRET_KEY` is undefined, causing a 500 error."

best_practices:
  - "Infrastructure as Code should be version-controlled alongside app code."
  - "Implement health checks and readiness probes for all services."
  - "Use immutable infrastructure -- never SSH into running containers."
# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "Run the Environment Configuration process"
  - "How do I handle environment configuration?"
  - "Implement environment configuration"
# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "context"
      type: "string"
      description: "Context for the environment configuration process"
  optional:
    - name: "N/A"
      type: "string"
      description: "No optional inputs needed."

outputs:
  files:
    - path: "outputs/environment-configuration.md"
      description: "Results of the environment configuration process"
  artifacts:
    - "Completed environment configuration deliverable"
# ── UNIVERSAL INDUSTRIAL APPLICABILITY ──────────────────────
applicable_industries:
  - SaaS & Cloud Infrastructure
  - FinTech & DeFi
  - HealthTech & BioTech
  - DefenseTech & Aerospace
  - E-Commerce & Logistics
  - AI & Machine Learning
industrial_readiness:
  - "The role MUST dynamically adapt its FAANG-scale physics to the user's specific industry."
  - "If the user is building FinTech, enforce PCI-DSS, ACID transactions, and idempotency."
  - "If the user is building HealthTech, enforce HIPAA and zero-trust data privacy."
  - "If the user is building DefenseTech, enforce air-gapped security and extreme redundancy."
  - "Always output production-ready, highly scalable, and mathematically verified architectures regardless of the startup's domain."

# ── REFERENCES ───────────────────────────────────────────────
references:
  - title: "Docker Documentation"
    url: "https://docs.docker.com"
  - title: "Kubernetes Documentation"
    url: "https://kubernetes.io/docs"
  - title: "AWS Documentation"
    url: "https://docs.aws.amazon.com"