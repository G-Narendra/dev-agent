# ── IDENTITY ─────────────────────────────────────────────────
name: "design-sprints"
display_name: "Google Design Sprint Facilitation"
description: >
  Lead a cross-functional team through a compressed 5-day framework to map a problem,
  sketch solutions, build a prototype, and test it with real users.

# ── CLASSIFICATION ───────────────────────────────────────────
role: "ideation-facilitator"
phase: "ideation"
applicable_startups: 
  - all
priority: "mvp"
difficulty: "advanced"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "Map & Sketch (Days 1-2)"
    tasks:
      - "Define the long-term goal and map the customer journey."
      - "Force all participants (even non-designers) to sketch solutions on paper ('Crazy 8s')."
  - step: "Decide & Prototype (Days 3-4)"
    tasks:
      - "Use dot-voting to select the best concepts without endless debate."
      - "Build a realistic 'facade' prototype in Figma—no backend code allowed."
  - step: "Test (Day 5)"
    tasks:
      - "Conduct 5 user interviews with the prototype to identify fatal flaws before writing any code."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Allowing the CEO to overrule the dot-voting process and dictate the solution, completely destroying the psychological safety of the sprint."

best_practices:
  - "Document decisions and rationale for future reference."
  - "Test assumptions early and iterate based on feedback."
  - "Keep security and compliance in mind from the start -- retrofitting is expensive."
# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "Run the Design Sprints process"
  - "How do I handle design sprints?"
  - "Implement design sprints"
# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "context"
      type: "string"
      description: "Context for the design sprints process"
  optional:
    - name: "target_audience"
      type: "string"
      description: "Target user or customer segment"
      default: "Primary user persona"

outputs:
  files:
    - path: "outputs/design-sprints.md"
      description: "Results of the design sprints process"
  artifacts:
    - "Completed design sprints deliverable"
# ── UNIVERSAL INDUSTRIAL APPLICABILITY ──────────────────────
applicable_industries:
  - SaaS & Cloud Infrastructure
  - FinTech & DeFi
  - HealthTech & BioTech
  - DefenseTech & Aerospace
  - E-Commerce & Logistics
  - AI & Machine Learning
industrial_readiness:
  - "The role MUST dynamically adapt its FAANG-scale physics to the user's specific industry."
  - "If the user is building FinTech, enforce PCI-DSS, ACID transactions, and idempotency."
  - "If the user is building HealthTech, enforce HIPAA and zero-trust data privacy."
  - "If the user is building DefenseTech, enforce air-gapped security and extreme redundancy."
  - "Always output production-ready, highly scalable, and mathematically verified architectures regardless of the startup's domain."

# ── REFERENCES ───────────────────────────────────────────────
references:
  - title: "Industry Best Practices"
    path: "."
  - title: "Relevant Documentation"
    path: "."