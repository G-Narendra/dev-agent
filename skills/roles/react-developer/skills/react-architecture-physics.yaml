trigger_phrases:
  - "Build the frontend in React."
  - "The UI is lagging."
  - "Refactor the state management."
  - "Upgrade to React 18/Next.js."

# ── ACTIONS ──────────────────────────────────────────────────
example_cli_actions:
  - "Generate React Server Component Architecture."
  - "Draft Re-render Telemetry Report."

# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "feature"
      type: "string"
      description: "e.g., Data Dashboard, User Profile."
  optional:
