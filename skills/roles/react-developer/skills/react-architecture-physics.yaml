  artifacts:
    - "N/A"

# ── SUCCESS CRITERIA ─────────────────────────────────────────
automated:
  - "N/A"
manual:
  - "The application mathematically maintains 60 frames-per-second (fps) during heavy data table scrolling with < 10ms render times."

# ── PERMISSIONS & SAFETY ─────────────────────────────────────
permissions_needed:
  - "none"
safety_notes:
  - "The 'Global State' Catastrophe: Never put a rapidly changing variable (like mouse position or an active text input) into a global Redux or Context store at the root of the app. This mathematically forces every single component in the application to re-render on every keystroke, destroying performance."

# ── TOOLING ──────────────────────────────────────────────────
recommended_tools:
  primary:
    - name: "React 18 / Next.js (App Router) / TypeScript / Zustand"
      install: "N/A"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "Strict React Server Components (RSC)"
    tasks:
      - "Eradicate shipping heavy libraries to the browser (e.g., `moment.js` or `marked`). You MUST engineer the architecture so heavy data fetching and Markdown parsing happen in a Server Component (`.server.tsx`). Only ship the lightweight, interactive HTML to the client."
  - step: "The `useEffect` Eradication"
    tasks:
      - "Do not use `useEffect` to fetch data or derive state. It mathematically causes waterfall render cycles (render -> fetch -> render). You MUST use a strict data fetching library (React Query / SWR) or Server Actions, and calculate derived state synchronously during the render cycle."
  - step: "Strict State Collocation"
    tasks:
      - "If a piece of state is only used by a Modal component, do not put it in the parent Page component. You MUST mathematically push state down the tree as close to the consuming component as possible to isolate re-rendering blast radiuses."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Blind Memoization: Wrapping every component in `React.memo` and every function in `useCallback`. This mathematically consumes more memory and CPU checking shallow equality than just letting React re-render the lightweight div. You MUST only memoize highly expensive components (e.g., 3D canvases, heavy charts)."

best_practices:
  - "Implement strict 'Custom Hooks' for Logic. A component MUST mathematically only contain UI JSX. All complex business logic, API calls, and state management MUST be extracted into isolated, highly testable custom hooks (e.g., `useCheckout()`)."

