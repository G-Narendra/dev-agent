# ── PERMISSIONS & SAFETY ─────────────────────────────────────
permissions_needed:
  - "none"
safety_notes:
  - "The 'Event Loop Block' Catastrophe: Never run `JSON.parse()` on a 50MB payload, or execute a complex `Regex`, or run a massive `for` loop on the main thread. Node.js is single-threaded. Blocking the Event Loop for 2 seconds mathematically prevents *all* other users from receiving HTTP responses. You MUST offload CPU-bound work to Worker Threads."

# ── TOOLING ──────────────────────────────────────────────────
recommended_tools:
  primary:
    - name: "Node.js / Chrome DevTools (Profiler) / Clinic.js / Jest"
      install: "N/A"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "Strict Stream Processing"
    tasks:
      - "Eradicate `fs.readFileSync()`. If you read a 2GB file into memory, the V8 engine will mathematically crash with `JavaScript heap out of memory`. You MUST engineer Node Streams (`fs.createReadStream().pipe(transform).pipe(write)`) to process data in small, memory-safe chunks."
  - step: "Promise Concurrency Control"
    tasks:
      - "Do not use `Promise.all()` to execute 10,000 database inserts simultaneously. This mathematically overwhelms the connection pool and spikes memory. You MUST implement a concurrency limiter (e.g., `p-limit`) to execute them in batches of 100."
  - step: "Memory Leak Physics"
    tasks:
      - "Closures and global variables mathematically trap memory. If you append an object to a global array on every HTTP request, the Garbage Collector cannot free it. You MUST generate Heap Snapshots under load and mathematically trace retained sizes back to the GC roots."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Unhandled Promise Rejections: Forgetting a `.catch()` or `try/catch` around an async call. In modern Node.js, an unhandled rejection mathematically crashes the entire process. You MUST enforce strict error handling at all boundaries."

best_practices:
  - "Implement strict 'Monamorphic Inline Caches' (V8 Optimization). Do not dynamically add/remove properties to objects (`delete obj.prop`). This mathematically forces the V8 engine to de-optimize the class shape into a slow dictionary mode. Always initialize properties in the constructor, even if `null`."

