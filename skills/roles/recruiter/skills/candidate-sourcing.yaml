# ── IDENTITY ─────────────────────────────────────────────────
name: "candidate-sourcing"
display_name: "Outbound Sourcing & Candidate Closing"
description: >
  Execute highly targeted outbound sourcing campaigns to attract passive candidates, manage 
  the interview pipeline, and negotiate complex equity-heavy compensation packages.

# ── CLASSIFICATION ───────────────────────────────────────────
role: "recruiter"
phase: "growth"
applicable_startups: 
  - all
priority: "mvp"
difficulty: "advanced"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "Sourcing"
    tasks:
      - "Use boolean search strings on LinkedIn/GitHub to find passive candidates with exact tech stack matches."
      - "Write hyper-personalized cold outreach emails (e.g., referencing a specific open-source contribution they made)."
  - step: "Pipeline Velocity"
    tasks:
      - "Enforce a strict 48-hour SLA for hiring managers to provide feedback on an interview."
  - step: "Closing"
    tasks:
      - "Pre-close the candidate early by understanding their exact motivations (Cash vs. Equity vs. Title)."
      - "Present the final offer highlighting the long-term value of the equity using multiple exit scenarios."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Sending an automated, generic 'I have a great opportunity for you' LinkedIn message to a Staff Engineer who gets 20 identical messages a day."

best_practices:
  - "Document decisions and rationale for future reference."
  - "Test assumptions early and iterate based on feedback."
  - "Keep security and compliance in mind from the start -- retrofitting is expensive."
# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "Run the Candidate Sourcing process"
  - "How do I handle candidate sourcing?"
  - "Implement candidate sourcing"
# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "context"
      type: "string"
      description: "Context for the candidate sourcing process"
  optional:
    - name: "N/A"
      type: "string"
      description: "No optional inputs needed."

outputs:
  files:
    - path: "outputs/candidate-sourcing.md"
      description: "Results of the candidate sourcing process"
  artifacts:
    - "Completed candidate sourcing deliverable"
# ── UNIVERSAL INDUSTRIAL APPLICABILITY ──────────────────────
applicable_industries:
  - SaaS & Cloud Infrastructure
  - FinTech & DeFi
  - HealthTech & BioTech
  - DefenseTech & Aerospace
  - E-Commerce & Logistics
  - AI & Machine Learning
industrial_readiness:
  - "The role MUST dynamically adapt its FAANG-scale physics to the user's specific industry."
  - "If the user is building FinTech, enforce PCI-DSS, ACID transactions, and idempotency."
  - "If the user is building HealthTech, enforce HIPAA and zero-trust data privacy."
  - "If the user is building DefenseTech, enforce air-gapped security and extreme redundancy."
  - "Always output production-ready, highly scalable, and mathematically verified architectures regardless of the startup's domain."

# ── REFERENCES ───────────────────────────────────────────────
references:
  - title: "Industry Best Practices"
    path: "."
  - title: "Relevant Documentation"
    path: "."