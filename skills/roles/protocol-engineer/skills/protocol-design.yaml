# ── IDENTITY ─────────────────────────────────────────────────
name: "protocol-design"
display_name: "Blockchain Protocol Architecture"
description: >
  Designs and implements blockchain protocols and consensus mechanisms. 
  Works on layer-1 and layer-2 scaling solutions, cross-chain bridges, 
  and protocol-level incentive structures.

# ── CLASSIFICATION ───────────────────────────────────────────
role: "protocol-engineer"
phase: "build"
applicable_startups:
  - web3
priority: "critical"
difficulty: "expert"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "Consensus Mechanism"
    tasks:
      - "Design or select consensus mechanism (PoS, DPoS, PBFT)."
      - "Implement validator/node reward and slashing logic."
  - step: "Smart Contract Layer"
    tasks:
      - "Design the base layer smart contract architecture."
      - "Implement protocol-level upgrades (proxy patterns, DAO governance)."
  - step: "Security"
    tasks:
      - "Conduct formal verification of critical protocol logic."
      - "Perform extensive testnet deployment and auditing."

# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "Run the Protocol Design process"
  - "How do I handle protocol design?"
  - "Implement protocol design"
  - "Designs and implements blockchain protocols and consensus mechanisms"
# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "context"
      type: "string"
      description: "Context for the protocol design process"
  optional:
    - name: "code_repository"
      type: "string"
      description: "Path to the code repository"
      default: "./"

outputs:
  files:
    - path: "outputs/protocol-design.md"
      description: "Results of the protocol design process"
  artifacts:
    - "Completed protocol design deliverable"
# ── QUALITY GATES ────────────────────────────────────────────
best_practices:
  - "Document decisions and rationale for future reference."
  - "Test assumptions early and iterate based on feedback."
  - "Keep security and compliance in mind from the start — retrofitting is expensive."
anti_patterns:
  - "Launching on mainnet without a formal audit from a reputable security firm."
  - "Designing upgrade mechanisms without decentralized governance — single point of failure."
  - "Optimizing for TPS at the expense of decentralization or security."
# ── UNIVERSAL INDUSTRIAL APPLICABILITY ──────────────────────
applicable_industries:
  - SaaS & Cloud Infrastructure
  - FinTech & DeFi
  - HealthTech & BioTech
  - DefenseTech & Aerospace
  - E-Commerce & Logistics
  - AI & Machine Learning
industrial_readiness:
  - "The role MUST dynamically adapt its FAANG-scale physics to the user's specific industry."
  - "If the user is building FinTech, enforce PCI-DSS, ACID transactions, and idempotency."
  - "If the user is building HealthTech, enforce HIPAA and zero-trust data privacy."
  - "If the user is building DefenseTech, enforce air-gapped security and extreme redundancy."
  - "Always output production-ready, highly scalable, and mathematically verified architectures regardless of the startup's domain."

# ── REFERENCES ───────────────────────────────────────────────
references:
  - title: "Industry Best Practices"
    path: "."
  - title: "Relevant Documentation"
    path: "."