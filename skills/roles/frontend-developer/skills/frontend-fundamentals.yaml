# ── IDENTITY ─────────────────────────────────────────────────
name: "frontend-fundamentals"
display_name: "Frontend Fundamentals & Rendering"
description: >
  Implement robust frontend architectures using semantic HTML, efficient state 
  management, and optimized rendering lifecycles (CSR/SSR).

# ── CLASSIFICATION ───────────────────────────────────────────
role: "frontend-developer"
phase: "build"
applicable_startups: 
  - all
priority: "high"
difficulty: "expert"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "State Colocation"
    tasks:
      - "Do not put UI state (like `isDropdownOpen`) into a global Redux/Zustand store. Keep state as close to the component that uses it as possible to prevent unnecessary re-renders."
  - step: "Semantic HTML & A11y"
    tasks:
      - "Use `<button>` for clickable actions and `<a>` for navigation. Never attach an `onClick` handler to a `<div>` without proper `role` and `tabindex` attributes."
  - step: "Optimistic UI"
    tasks:
      - "When a user clicks 'Like' or 'Save', update the UI instantly before the network request finishes, then silently revert if the backend returns a 500 error."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Writing a React component that makes 5 separate `useEffect` API calls on mount, causing the UI to aggressively flicker and waterfall load for 3 seconds."

best_practices:
  - "Document decisions and rationale for future reference."
  - "Test assumptions early and iterate based on feedback."
  - "Keep security and compliance in mind from the start -- retrofitting is expensive."
# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "Run the Frontend Fundamentals process"
  - "How do I handle frontend fundamentals?"
  - "Implement frontend fundamentals"
# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "context"
      type: "string"
      description: "Context for the frontend fundamentals process"
  optional:
    - name: "code_repository"
      type: "string"
      description: "Path to the code repository"
      default: "./"

outputs:
  files:
    - path: "outputs/frontend-fundamentals.md"
      description: "Results of the frontend fundamentals process"
  artifacts:
    - "Completed frontend fundamentals deliverable"
# ── UNIVERSAL INDUSTRIAL APPLICABILITY ──────────────────────
applicable_industries:
  - SaaS & Cloud Infrastructure
  - FinTech & DeFi
  - HealthTech & BioTech
  - DefenseTech & Aerospace
  - E-Commerce & Logistics
  - AI & Machine Learning
industrial_readiness:
  - "The role MUST dynamically adapt its FAANG-scale physics to the user's specific industry."
  - "If the user is building FinTech, enforce PCI-DSS, ACID transactions, and idempotency."
  - "If the user is building HealthTech, enforce HIPAA and zero-trust data privacy."
  - "If the user is building DefenseTech, enforce air-gapped security and extreme redundancy."
  - "Always output production-ready, highly scalable, and mathematically verified architectures regardless of the startup's domain."

# ── REFERENCES ───────────────────────────────────────────────
references:
  - title: "Industry Best Practices"
    path: "."
  - title: "Relevant Documentation"
    path: "."