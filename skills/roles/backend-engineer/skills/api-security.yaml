# ── IDENTITY ─────────────────────────────────────────────────
name: "api-security"
display_name: "API Security & Threat Mitigation"
description: >
  Harden backend APIs against OWASP Top 10 vulnerabilities, including SQL injection, 
  XSS, CSRF, and Broken Object Level Authorization (BOLA/IDOR).

# ── CLASSIFICATION ───────────────────────────────────────────
role: "backend-engineer"
phase: "build"
applicable_startups: 
  - all
priority: "high"
difficulty: "expert"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "Authorization (BOLA)"
    tasks:
      - "Ensure EVERY endpoint that modifies a resource verifies that the authenticated `user_id` actually owns the `resource_id` they are trying to access."
  - step: "Input Sanitization"
    tasks:
      - "Validate all incoming data payloads using strict schemas (e.g., Zod) and reject unknown keys."
  - step: "Security Headers"
    tasks:
      - "Configure strict Content Security Policy (CSP), CORS, and HSTS headers on all API responses."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Failing to check ownership on an API route like `DELETE /api/invoice/:id`, allowing any authenticated user to simply loop through IDs and delete everyone else's data."

best_practices:
  - "Design APIs with idempotency in mind -- same request, same result."
  - "Always validate inputs at the API boundary before processing."
  - "Use database transactions for operations that modify multiple records."
# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "Run the Api Security process"
  - "How do I handle api security?"
  - "Implement api security"
# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "context"
      type: "string"
      description: "Context for the api security process"
  optional:
    - name: "N/A"
      type: "string"
      description: "No optional inputs needed."

outputs:
  files:
    - path: "outputs/api-security.md"
      description: "Results of the api security process"
  artifacts:
    - "Completed api security deliverable"
# ── UNIVERSAL INDUSTRIAL APPLICABILITY ──────────────────────
applicable_industries:
  - SaaS & Cloud Infrastructure
  - FinTech & DeFi
  - HealthTech & BioTech
  - DefenseTech & Aerospace
  - E-Commerce & Logistics
  - AI & Machine Learning
industrial_readiness:
  - "The role MUST dynamically adapt its FAANG-scale physics to the user's specific industry."
  - "If the user is building FinTech, enforce PCI-DSS, ACID transactions, and idempotency."
  - "If the user is building HealthTech, enforce HIPAA and zero-trust data privacy."
  - "If the user is building DefenseTech, enforce air-gapped security and extreme redundancy."
  - "Always output production-ready, highly scalable, and mathematically verified architectures regardless of the startup's domain."

# ── REFERENCES ───────────────────────────────────────────────
references:
  - title: "PostgreSQL Documentation"
    url: "https://postgresql.org/docs"
  - title: "Node.js Documentation"
    url: "https://nodejs.org/en/docs/"