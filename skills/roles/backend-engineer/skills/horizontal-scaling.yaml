# ── IDENTITY ─────────────────────────────────────────────────
name: "horizontal-scaling"
display_name: "Horizontal Scaling Architecture"
description: >
  Architect the backend to scale horizontally across multiple stateless nodes rather 
  than vertically scaling a single massive server.

# ── CLASSIFICATION ───────────────────────────────────────────
role: "backend-engineer"
phase: "growth"
applicable_startups: 
  - consumer
  - saas
priority: "high"
difficulty: "expert"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "Statelessness"
    tasks:
      - "Remove all in-memory session states (e.g., Express sessions) and move them to a distributed Redis cache."
  - step: "Load Balancing"
    tasks:
      - "Place an Application Load Balancer (ALB) in front of the application cluster to distribute incoming traffic evenly across all healthy nodes."
  - step: "Read Replicas"
    tasks:
      - "Configure Postgres Read Replicas and route all heavy `GET` queries to the replicas, reserving the primary database purely for `INSERT/UPDATE` mutations."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Storing user uploaded images on the local disk of the API server (`/uploads`), meaning if the load balancer routes the user to Node 2, their image 404s."

best_practices:
  - "Design APIs with idempotency in mind -- same request, same result."
  - "Always validate inputs at the API boundary before processing."
  - "Use database transactions for operations that modify multiple records."
# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "Run the Horizontal Scaling process"
  - "How do I handle horizontal scaling?"
  - "Implement horizontal scaling"
# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "context"
      type: "string"
      description: "Context for the horizontal scaling process"
  optional:
    - name: "N/A"
      type: "string"
      description: "No optional inputs needed."

outputs:
  files:
    - path: "outputs/horizontal-scaling.md"
      description: "Results of the horizontal scaling process"
  artifacts:
    - "Completed horizontal scaling deliverable"
# ── UNIVERSAL INDUSTRIAL APPLICABILITY ──────────────────────
applicable_industries:
  - SaaS & Cloud Infrastructure
  - FinTech & DeFi
  - HealthTech & BioTech
  - DefenseTech & Aerospace
  - E-Commerce & Logistics
  - AI & Machine Learning
industrial_readiness:
  - "The role MUST dynamically adapt its FAANG-scale physics to the user's specific industry."
  - "If the user is building FinTech, enforce PCI-DSS, ACID transactions, and idempotency."
  - "If the user is building HealthTech, enforce HIPAA and zero-trust data privacy."
  - "If the user is building DefenseTech, enforce air-gapped security and extreme redundancy."
  - "Always output production-ready, highly scalable, and mathematically verified architectures regardless of the startup's domain."

# ── REFERENCES ───────────────────────────────────────────────
references:
  - title: "PostgreSQL Documentation"
    url: "https://postgresql.org/docs"
  - title: "Node.js Documentation"
    url: "https://nodejs.org/en/docs/"