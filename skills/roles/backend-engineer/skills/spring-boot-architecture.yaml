# ── IDENTITY ─────────────────────────────────────────────────
name: "spring-boot-architecture"
display_name: "Java Spring Boot Architecture"
description: >
  Build enterprise-grade, highly scalable backend services using Java Spring Boot, 
  optimizing for thread safety, JPA/Hibernate performance, and security.

# ── CLASSIFICATION ───────────────────────────────────────────
role: "backend-engineer"
phase: "build"
applicable_startups: 
  - enterprise
  - fintech
priority: "high"
difficulty: "expert"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "JPA Optimization"
    tasks:
      - "Solve the N+1 query problem by using `@EntityGraph` or `JOIN FETCH` in JPQL rather than executing 100 separate select statements in a loop."
  - step: "Dependency Injection"
    tasks:
      - "Use Constructor Injection instead of `@Autowired` field injection to ensure beans are immutable and easily testable."
  - step: "Transaction Management"
    tasks:
      - "Place `@Transactional` on the Service layer, not the Controller, ensuring database operations roll back cleanly if an exception is thrown."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Fetching a massive list of Entities from the database, doing the filtering in Java using Streams, rather than writing a proper SQL `WHERE` clause."

best_practices:
  - "Design APIs with idempotency in mind -- same request, same result."
  - "Always validate inputs at the API boundary before processing."
  - "Use database transactions for operations that modify multiple records."
# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "Run the Spring Boot Architecture process"
  - "How do I handle spring boot architecture?"
  - "Implement spring boot architecture"
# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "context"
      type: "string"
      description: "Context for the spring boot architecture process"
  optional:
    - name: "N/A"
      type: "string"
      description: "No optional inputs needed."

outputs:
  files:
    - path: "outputs/spring-boot-architecture.md"
      description: "Results of the spring boot architecture process"
  artifacts:
    - "Completed spring boot architecture deliverable"
# ── UNIVERSAL INDUSTRIAL APPLICABILITY ──────────────────────
applicable_industries:
  - SaaS & Cloud Infrastructure
  - FinTech & DeFi
  - HealthTech & BioTech
  - DefenseTech & Aerospace
  - E-Commerce & Logistics
  - AI & Machine Learning
industrial_readiness:
  - "The role MUST dynamically adapt its FAANG-scale physics to the user's specific industry."
  - "If the user is building FinTech, enforce PCI-DSS, ACID transactions, and idempotency."
  - "If the user is building HealthTech, enforce HIPAA and zero-trust data privacy."
  - "If the user is building DefenseTech, enforce air-gapped security and extreme redundancy."
  - "Always output production-ready, highly scalable, and mathematically verified architectures regardless of the startup's domain."

# ── REFERENCES ───────────────────────────────────────────────
references:
  - title: "PostgreSQL Documentation"
    url: "https://postgresql.org/docs"
  - title: "Node.js Documentation"
    url: "https://nodejs.org/en/docs/"