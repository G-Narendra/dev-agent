# ── IDENTITY ─────────────────────────────────────────────────
name: "nestjs-architecture"
display_name: "NestJS Microservices Architecture"
description: >
  Build heavily structured, dependency-injected backend services using NestJS and TypeScript,
  enforcing a strict Module-Controller-Service layered architecture.

# ── CLASSIFICATION ───────────────────────────────────────────
role: "backend-engineer"
phase: "build"
applicable_startups: 
  - enterprise
  - saas
priority: "high"
difficulty: "expert"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "Layered Architecture"
    tasks:
      - "Ensure Controllers ONLY handle HTTP routing/validation, and pass data immediately to Services where 100% of the business logic lives."
  - step: "Validation & Transformation"
    tasks:
      - "Use `class-validator` and `class-transformer` on DTOs, paired with a global `ValidationPipe` to strictly reject malformed incoming payloads."
  - step: "Interceptors & Guards"
    tasks:
      - "Use global Guards for authentication (JWT/RBAC) rather than writing custom middleware, integrating cleanly with Nest's execution context."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Writing raw SQL queries directly inside a NestJS Controller, completely bypassing the Service layer, DTO validation, and the ORM repository."

best_practices:
  - "Design APIs with idempotency in mind -- same request, same result."
  - "Always validate inputs at the API boundary before processing."
  - "Use database transactions for operations that modify multiple records."
# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "Run the Nestjs Architecture process"
  - "How do I handle nestjs architecture?"
  - "Implement nestjs architecture"
# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "context"
      type: "string"
      description: "Context for the nestjs architecture process"
  optional:
    - name: "N/A"
      type: "string"
      description: "No optional inputs needed."

outputs:
  files:
    - path: "outputs/nestjs-architecture.md"
      description: "Results of the nestjs architecture process"
  artifacts:
    - "Completed nestjs architecture deliverable"
# ── UNIVERSAL INDUSTRIAL APPLICABILITY ──────────────────────
applicable_industries:
  - SaaS & Cloud Infrastructure
  - FinTech & DeFi
  - HealthTech & BioTech
  - DefenseTech & Aerospace
  - E-Commerce & Logistics
  - AI & Machine Learning
industrial_readiness:
  - "The role MUST dynamically adapt its FAANG-scale physics to the user's specific industry."
  - "If the user is building FinTech, enforce PCI-DSS, ACID transactions, and idempotency."
  - "If the user is building HealthTech, enforce HIPAA and zero-trust data privacy."
  - "If the user is building DefenseTech, enforce air-gapped security and extreme redundancy."
  - "Always output production-ready, highly scalable, and mathematically verified architectures regardless of the startup's domain."

# ── REFERENCES ───────────────────────────────────────────────
references:
  - title: "PostgreSQL Documentation"
    url: "https://postgresql.org/docs"
  - title: "Node.js Documentation"
    url: "https://nodejs.org/en/docs/"