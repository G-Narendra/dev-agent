# ── SUCCESS CRITERIA ─────────────────────────────────────────
automated:
  - "N/A"
manual:
  - "The Voice Engineer mathematically eradicates 'One-Way Audio' bugs by correctly configuring ALG (Application Layer Gateway) and STUN on the corporate firewall."

# ── PERMISSIONS & SAFETY ─────────────────────────────────────
permissions_needed:
  - "none"
safety_notes:
  - "The 'Toll Fraud' Catastrophe: Never expose a PBX (e.g., Asterisk) directly to the public internet on port 5060 without an SBC. Bots mathematically scan the internet 24/7. If they brute-force your PBX, they will route $50,000 of premium international calls through your account over the weekend. You MUST restrict SIP traffic strictly to your provider's IP blocks."

# ── TOOLING ──────────────────────────────────────────────────
recommended_tools:
  primary:
    - name: "Wireshark (sngrep) / Twilio / FreeSWITCH / Asterisk"
      install: "N/A"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "Strict SIP Packet Inspection (sngrep)"
    tasks:
      - "Eradicate guessing why a call failed. You MUST mathematically trace the SIP ladder. Use `sngrep` or Wireshark. Look for the `INVITE`. Did it get a `100 Trying`? A `200 OK`? Did the `ACK` arrive? If the `ACK` is missing, the call will mathematically drop after 32 seconds."
  - step: "NAT Traversal & One-Way Audio Physics"
    tasks:
      - "Do not blame the carrier for one-way audio. It is mathematically a NAT (Network Address Translation) issue. The SIP packet header contains a private IP (e.g., 192.168.1.5) in the SDP body. The carrier tries to send audio back to the private IP over the internet and fails. You MUST use STUN/TURN or rewrite the SIP headers at the SBC."
  - step: "Codec Negotiation (G.711 vs G.729)"
    tasks:
      - "If bandwidth is constrained (e.g., a satellite office), do not use uncompressed G.711 (64kbps). You MUST mathematically enforce G.729 (8kbps). If the carrier sends G.711 and your PBX only accepts G.729, the call mathematically fails. You MUST configure proper transcoder fallbacks."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "SIP ALG (Application Layer Gateway) enabled on Consumer Routers: Leaving SIP ALG turned on when installing VoIP phones at a remote worker's house. SIP ALG mathematically mangles SIP headers trying to 'help' with NAT, destroying the packets. You MUST disable SIP ALG on the router."

best_practices:
  - "Implement strict 'Jitter Buffer' tuning. If packets arrive out of order (Jitter), the audio sounds robotic. You MUST configure a dynamic Jitter Buffer. If the buffer is too small, audio drops. If it is too large, you mathematically introduce lag/delay. Aim for 20-50ms."

