# ── IDENTITY ─────────────────────────────────────────────────
name: "combine-framework"
display_name: "Swift Combine & Reactive Programming"
description: >
  Handles complex asynchronous data streams in iOS using the Combine framework. 
  Manages network requests, user input debouncing, and state synchronization 
  elegantly without falling into closure callback hell. Covers key patterns to avoid common pitfalls like storing sensitive tokens or credentials in plaintext in user, and provides actionable best practices for production-ready results.
# ── CLASSIFICATION ───────────────────────────────────────────
role: "mobile-developer-swift"
phase: "build"
applicable_startups:
  - all
priority: "high"
difficulty: "advanced"

# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "The search bar fires too many requests."
  - "Chain these three API calls together."
  - "Implement the Combine pipeline."

# ── ACTIONS ──────────────────────────────────────────────────
example_cli_actions:
  - "Draft Combine publisher pipeline."
  - "Generate custom subscriber."

# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "data_stream"
      type: "string"
      description: "The source of the data (e.g., URLSession, TextField)."
  optional:
    - name: "operators"
      type: "string"
      description: "Map, Filter, Debounce."
      default: "Debounce + Map"

outputs:
  files:
    - path: "Shared/Services/NetworkPublisher.swift"
      description: "The reactive networking service."
  artifacts:
    - "N/A"

# ── SUCCESS CRITERIA ─────────────────────────────────────────
automated:
  - "Unit tests verify that the pipeline correctly filters out invalid data before it reaches the UI subscriber."
manual:
  - "Typing rapidly in the search bar only triggers one API call after the user pauses for 300ms, saving server bandwidth."

# ── PERMISSIONS & SAFETY ─────────────────────────────────────
permissions_needed:
  - "none"

safety_notes:
  - "Memory Leaks (AnyCancellable): If you forget to store the returned `AnyCancellable` in a `Set<AnyCancellable>`, the subscription will be immediately deallocated and the pipeline will silently fail to execute."

# ── TOOLING ──────────────────────────────────────────────────
recommended_tools:
  primary:
    - name: "Combine"
      install: "N/A (Built into iOS 13+)"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "Thread Safety (receive(on:))"
    tasks:
      - "Always perform heavy data mapping (JSON decoding) on a background queue, and explicitly switch back to the `DispatchQueue.main` using `.receive(on:)` before updating the UI."
  - step: "Debouncing User Input"
    tasks:
      - "Attach a `.debounce(for: 0.3, scheduler: RunLoop.main)` operator to any `UITextField` publisher to prevent spamming the backend with a search query for every single keystroke."
      - "Add environment variable validation that crashes fast on missing required values."
  - step: "Error Handling (catch)"
    tasks:
      - "Use `.catch` to intercept network errors. Instead of crashing the stream, return a `Just(FallbackData())` publisher so the UI gracefully shows an empty state rather than breaking the subscription entirely."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Storing sensitive tokens or credentials in plaintext in UserDefaults/SharedPreferences -- use the platform Keychain/Keystore."
  - "Ignoring memory warnings on low-end devices -- mobile apps crash silently when the OS kills them for memory pressure."
  - "Blocking the main thread with network calls or heavy computation -- the UI freezes and the OS shows an Application Not Responding dialog."
  - "Forcing users to download large assets on cellular data -- check connectivity and defer to WiFi."
  - "Not handling deep link fallbacks -- if your app isn't installed, the link should gracefully open the app store."
best_practices:
  - "Use `.eraseToAnyPublisher()` at the end of your pipelines in your Service layer to hide the complex, massive nested types (like `Publishers.Map<Publishers.Filter...`) from the View layer."

  - "Test on the lowest-spec device you support, not just the latest flagship — that's what most of your users have."
  - "Implement offline-first architecture using local storage and sync — mobile networks are unreliable."
  - "Handle deep links and universal links properly — they're the primary way users return to your app from elsewhere."
  - "Use ProGuard/R8 (Android) or app thinning (iOS) to reduce APK/IPA size — smaller apps have higher install conversion."
  - "Add pull-to-refresh and retry mechanisms on all data screens — mobile users expect to manually refresh when data feels stale."
# ── UNIVERSAL INDUSTRIAL APPLICABILITY ──────────────────────
applicable_industries:
  - SaaS & Cloud Infrastructure
  - FinTech & DeFi
  - HealthTech & BioTech
  - DefenseTech & Aerospace
  - E-Commerce & Logistics
  - AI & Machine Learning
industrial_readiness:
  - "The role MUST dynamically adapt its FAANG-scale physics to the user's specific industry."
  - "If the user is building FinTech, enforce PCI-DSS, ACID transactions, and idempotency."
  - "If the user is building HealthTech, enforce HIPAA and zero-trust data privacy."
  - "If the user is building DefenseTech, enforce air-gapped security and extreme redundancy."
  - "Always output production-ready, highly scalable, and mathematically verified architectures regardless of the startup's domain."

# ── REFERENCES ───────────────────────────────────────────────
references:
  - title: "Apple: Combine Framework"
    url: "https://developer.apple.com/documentation/combine"
