# ── IDENTITY ─────────────────────────────────────────────────
name: "viral-loops"
display_name: "Viral Loop & Referral Engine Engineering"
description: >
  Designs mathematical growth engines built directly into the product experience. 
  Engineers 'K-factor' loops where every new user naturally invites >1 additional 
  users through gamification, incentivized sharing, or network effects. Covers key patterns to avoid common pitfalls like launching a campaign without utm parameters -- you won't kno, and provides actionable best practices for production-ready results.
# ── CLASSIFICATION ───────────────────────────────────────────
role: "growth-hacker"
phase: "growth"
applicable_startups:
  - B2C, Social, SaaS
priority: "critical"
difficulty: "expert"

# ── TRIGGER ──────────────────────────────────────────────────
trigger_phrases:
  - "We need to lower our CAC (Customer Acquisition Cost)."
  - "How do we get users to invite their friends?"
  - "Build a referral program."

# ── ACTIONS ──────────────────────────────────────────────────
example_cli_actions:
  - "Generate viral loop mathematical model."
  - "Draft referral program spec."

# ── INPUTS / OUTPUTS ────────────────────────────────────────
inputs:
  required:
    - name: "product_value"
      type: "string"
      description: "Why does the user use the app? (e.g., File Storage)."
  optional:
    - name: "incentive_budget"
      type: "string"
      description: "How much can we pay for a referral?"
      default: "$0 (Intrinsic Virality)"

outputs:
  files:
    - path: "growth/campaigns/referral_loop_v1.md"
      description: "The viral loop architecture document."
  artifacts:
    - "N/A"

# ── SUCCESS CRITERIA ─────────────────────────────────────────
automated:
  - "N/A"
manual:
  - "The product's K-factor exceeds 1.0 (indicating exponential, free, organic growth)."

# ── PERMISSIONS & SAFETY ─────────────────────────────────────
permissions_needed:
  - "none"

safety_notes:
  - "Dark Patterns: Do not secretly scrape a user's address book and spam all their contacts without explicit, enthusiastic consent. It will destroy the brand's reputation permanently."

# ── TOOLING ──────────────────────────────────────────────────
recommended_tools:
  primary:
    - name: "Amplitude / Mixpanel"
      install: "N/A"

# ── IMPLEMENTATION CHECKLIST ─────────────────────────────────
implementation_checklist:
  - step: "Intrinsic vs Extrinsic Loops"
    tasks:
      - "Prioritize Intrinsic virality (e.g., Zoom: You *have* to invite someone to use the product) over Extrinsic virality (e.g., Uber: 'Give $10, Get $10'). Intrinsic loops are free and convert better."
  - step: "Frictionless Onboarding"
    tasks:
      - "When User A invites User B via a link, User B must experience the 'Aha!' moment within 30 seconds of clicking the link. Defer the email signup wall until *after* they see the value."
  - step: "The Double-Sided Reward"
    tasks:
      - "If using financial incentives, reward both parties. If you only reward the inviter, they feel like they are spamming their friends for personal gain. Make them feel generous."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Launching a campaign without UTM parameters -- you won't know which channel drove the conversions."
  - "A/B testing with a sample size too small to reach statistical significance -- making decisions on noise rather than signal."
  - "Optimizing for vanity metrics (impressions, page views) instead of actionable KPIs (conversion rate, revenue, retention)."
  - "Running ads without conversion tracking pixel installed -- you're paying for clicks but can't measure ROI."
  - "Ignoring mobile page speed for SEO -- Google's mobile-first indexing means a slow mobile site kills rankings."
  - "Calculate your Viral Cycle Time. If it takes a user 30 days to invite a friend, growth is slow. If they are prompted to invite a collaborator during a 5-minute onboarding flow, growth explodes."

  - "Set up end-to-end conversion tracking before launching any campaign — measure from impression to purchase."
  - "Run A/B tests until they reach 95% statistical significance before making decisions — premature conclusions are worse than no test."
  - "Build audience segments based on behavior, not just demographics — what users do is more predictive than who they are."
  - "Test email deliverability (SPF, DKIM, DMARC) before sending any campaign — authentication failures land in spam folders."
  - "Create a content calendar 30 days ahead and batch-create content — consistency beats intensity in content marketing."

# ── QUALITY GATES ────────────────────────────────────────────
anti_patterns:
  - "Not defining clear success criteria before starting a task -- leads to ambiguous outcomes, endless revisions, and wasted effort."

best_practices:
  - "Document all configuration decisions in an Architecture Decision Record (ADR) so future team members understand why choices were made."
  - "Implement comprehensive error handling with structured logging at every integration boundary to simplify debugging."
# ── UNIVERSAL INDUSTRIAL APPLICABILITY ──────────────────────
applicable_industries:
  - SaaS & Cloud Infrastructure
  - FinTech & DeFi
  - HealthTech & BioTech
  - DefenseTech & Aerospace
  - E-Commerce & Logistics
  - AI & Machine Learning
industrial_readiness:
  - "The role MUST dynamically adapt its FAANG-scale physics to the user's specific industry."
  - "If the user is building FinTech, enforce PCI-DSS, ACID transactions, and idempotency."
  - "If the user is building HealthTech, enforce HIPAA and zero-trust data privacy."
  - "If the user is building DefenseTech, enforce air-gapped security and extreme redundancy."
  - "Always output production-ready, highly scalable, and mathematically verified architectures regardless of the startup's domain."

# ── REFERENCES ───────────────────────────────────────────────
references:
  - title: "Andrew Chen: Viral Loop Math"
    url: "https://andrewchen.com/what-is-a-viral-loop/"
